/* ---------- estadísticas ---------- */
function dayStats(ds){
  const de=ds+DAY, r={sleepMs:0,sleeps:0,breast:0,breastMs:0,bottle:0,ml:0,solid:0,diapers:0,pipi:0,popo:0,meds:0,fev:null};
  const now=Date.now();
  for(const p of sleepInfo().periods){ const o=Math.min(p.end||now,de)-Math.max(p.ts,ds); if(o>0){ r.sleepMs+=o; r.sleeps++; } }
  for(const e of S.events){
    if(e.type==='sleep'||SP[e.type]) continue;
    if(e.ts<ds||e.ts>=de) continue;
    if(e.type==='breast'){ r.breast++; r.breastMs+=(e.end||now)-e.ts; }
    else if(e.type==='bottle'){ r.bottle++; r.ml+=e.ml||0; }
    else if(e.type==='solid') r.solid++;
    else if(e.type==='diaper'){ r.diapers++; if(e.kind!=='popo') r.pipi++; if(e.kind!=='pipi') r.popo++; }
    else if(e.type==='med'||e.type==='vaccine') r.meds++;
    else if(e.type==='fever'){ r.fev=r.fev==null?e.temp:Math.max(r.fev,e.temp); }
  }
  r.feeds=r.breast+r.bottle+r.solid; return r;
}
function sleepH(ms){ return Math.round(ms/36e5*10)/10; }
function fmtH(ms){ const m=Math.round(ms/60000); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; }

/* ---------- conclusiones de cada día (Historial) ---------- */
function dayConclusions(ds){
  const r=dayStats(ds), isToday=ds===startOfDay(Date.now()), aNow=ageAt(ds+DAY/2), out=[];
  const prev=[]; for(let i=1;i<=7;i++){ const d=ds-i*DAY; if(hasRec(d)) prev.push(dayStats(d)); }
  const avg=k=>prev.length?mean(prev.map(x=>x[k])):null;
  const nrec=S.events.filter(e=>e.ts>=ds&&e.ts<ds+DAY).length, enough=nrec>=MIN_DAY_REC;
  // 1. Resumen del día
  const parts=[];
  if(r.sleepMs>0) parts.push('durmió '+fmtH(r.sleepMs));
  if(r.feeds) parts.push(r.feeds+(r.feeds===1?' toma':' tomas')+(r.ml?' ('+r.ml+' ml de biberón)':''));
  if(r.diapers) parts.push(r.diapers+(r.diapers===1?' pañal':' pañales'));
  if(enough&&parts.length){ const t=parts.join(' · '); out.push({l:'info',t:(isToday?'Hasta ahora: ':'')+t.charAt(0).toUpperCase()+t.slice(1)}); }
  // 2. Alertas
  if(r.fev!=null&&r.fev>=38) out.push({l:'warn',t:'Tuvo fiebre: máxima de '+nf(r.fev)+' °C.'+(aNow!=null&&aNow<3?' En menores de 3 meses hay que consultar al médico.':'')});
  if(enough&&!isToday&&r.diapers&&aNow!=null&&aNow>=0.25&&r.pipi<6) out.push({l:'warn',t:'Solo '+r.pipi+(r.pipi===1?' pañal mojado':' pañales mojados')+' (lo habitual son 6 o más). Revisa si faltó anotar alguno.'});
  const de=ds+DAY, gaps=Object.values(sleepInfo().gaps).filter(g=>g.b.ts>=ds&&g.b.ts<de);
  if(enough&&gaps.length) out.push({l:'warn',t:gaps.length===1?'Hay un sueño incompleto: toca el + para completarlo.':'Hay '+gaps.length+' sueños incompletos: toca los + para completarlos.'});
  // 3. Comparación con su promedio de la semana anterior
  if(enough&&!isToday&&prev.length>=MIN_DAYS){
    const as=avg('sleepMs'), af=avg('feeds'), ad=avg('diapers');
    if(r.sleepMs>0&&as>0){ const dm=(r.sleepMs-as)/60000; if(Math.abs(dm)>=45) out.push({l:dm>0?'ok':'info',t:'Durmió '+fmtDur(Math.abs(dm)*60000)+(dm>0?' más':' menos')+' que su promedio de los días anteriores ('+fmtH(as)+').'}); }
    if(r.feeds&&af>0){ const df=r.feeds-af; if(Math.abs(df)>=2) out.push({l:'info',t:'Comió '+Math.round(Math.abs(df))+(Math.round(Math.abs(df))===1?' vez':' veces')+(df>0?' más':' menos')+' que de costumbre (promedio '+nf(af)+').'}); }
    if(r.diapers&&ad>0){ const dd=r.diapers-ad; if(Math.abs(dd)>=3) out.push({l:'info',t:(dd>0?'Más':'Menos')+' pañales que de costumbre (promedio '+nf(ad)+').'}); }
  }
  // 4. Sueño más largo del día
  const ps=sleepInfo().periods.filter(p=>p.end&&p.ts>=ds&&p.ts<de);
  if(enough&&ps.length){ const lg=ps.reduce((a,b)=>(b.end-b.ts)>(a.end-a.ts)?b:a); if(lg.end-lg.ts>=2*36e5) out.push({l:'ok',t:'Su sueño más largo: '+fmtDur(lg.end-lg.ts)+' seguidas, desde las '+hm(lg.ts)+'.'}); }
  // 5. Salud y alimentos
  const evs=S.events.filter(e=>e.ts>=ds&&e.ts<de);
  const vac=evs.filter(e=>e.type==='vaccine').map(e=>e.name).filter(Boolean);
  if(vac.length) out.push({l:'info',t:'Vacuna: '+vac.join(', ')+'.'});
  const meds=[...new Set(evs.filter(e=>e.type==='med').map(e=>e.name).filter(Boolean))];
  if(meds.length) out.push({l:'info',t:'Medicinas: '+meds.join(', ')+'.'});
  const foods=[...new Set(evs.filter(e=>e.type==='solid').map(e=>(e.food||'').trim()).filter(Boolean))];
  if(foods.length) out.push({l:'info',t:'Comió: '+foods.join(', ')+'.'});
  // Prioridad: resumen, alertas, comparaciones y lo demás; máximo 5
  return out.slice(0,5);
}

function growthInsights(m){
  const M=METRICS[m], sex=S.profile.sex, b=birthTs(), out=[];
  const rows=S.growth.filter(g=>g[m]!=null);
  if(!rows.length) return out;
  if(b==null||!LMS[sex]){ out.push({l:'info',t:'Agrega la fecha de nacimiento y si es niño o niña para comparar con la OMS.'}); }
  const last=rows[rows.length-1], ageL=ageAt(last.ts);
  const unitTxt=v=>nf(v,M.dec)+' '+M.unit;
  let zL=null;
  if(b!=null&&LMS[sex]&&ageL!=null&&ageL<=24){
    const r=lmsAt(sex,m,ageL); zL=zOf(last[m],r); const p=phi(zL)*100;
    out.push({l:(p>=3&&p<=97)?'ok':'warn',
      t:M.label+' en el percentil '+pctText(zL)+' para su edad',
      d:(p>=3&&p<=97?'Dentro del rango habitual (P3 a P97). ':'Fuera del rango habitual (P3 a P97): coméntalo con el pediatra. ')+'La mediana de la OMS a esa edad es '+unitTxt(r[1])+'; su medida fue '+unitTxt(last[m])+'.'});
  }
  if(rows.length>=2){
    const prev=rows[rows.length-2], days=(last.ts-prev.ts)/DAY;
    if(days>=3){
      const diff=last[m]-prev[m];
      let exp=null;
      if(b!=null&&LMS[sex]){ const a1=ageAt(prev.ts), a2=ageL; if(a1!=null&&a2<=24&&a1>=0){ exp=(lmsAt(sex,m,a2)[1]-lmsAt(sex,m,a1)[1]); } }
      if(m==='kg'){
        const gpd=diff*1000/days, epd=exp!=null?exp*1000/days:null;
        out.push({l:diff<0?'warn':(epd!=null&&gpd<epd*0.6?'info':'ok'),
          t:(diff<0?'Bajó ':'Subió ')+nf(Math.abs(diff)*1000,0)+' g en '+Math.round(days)+' días ('+nf(gpd,0)+' g al día)',
          d:(epd!=null?'Lo que gana un bebé en la mediana de la OMS en ese mismo periodo: unos '+nf(epd,0)+' g al día. ':'')+(diff<0?'Una baja de peso merece consultarse con el pediatra.':'Lo que más importa es que siga su propia curva.')});
      } else {
        const pm=diff/days*30.4, em=exp!=null?exp/days*30.4:null;
        out.push({l:diff<0?'info':'ok',t:(diff<0?'Cambió ':'Creció ')+nf(diff,1)+' cm en '+Math.round(days)+' días ('+nf(pm,1)+' cm al mes)',
          d:(em!=null?'Referencia de la mediana OMS para ese periodo: '+nf(em,1)+' cm al mes. ':'')+(diff<0?'Puede ser una diferencia de medición; revisa el dato.':'')});
      }
      if(zL!=null){
        const a1=ageAt(prev.ts); const r1=lmsAt(sex,m,a1);
        if(r1){ const z1=zOf(prev[m],r1), dz=zL-z1;
          if(dz<=-0.67) out.push({l:'warn',t:'Pasó del percentil '+pctText(z1)+' al '+pctText(zL),d:'Bajar más de una línea de percentil entre controles es algo para revisar con el pediatra.'});
          else if(dz>=0.67) out.push({l:'info',t:'Subió del percentil '+pctText(z1)+' al '+pctText(zL),d:'Ganó posición en la curva entre los dos últimos controles.'});
          else out.push({l:'ok',t:'Sigue su curva',d:'Entre los dos últimos controles se mantuvo cerca del mismo percentil ('+pctText(z1)+' y '+pctText(zL)+').'});
        }
      }
    }
  }
  const ago=(Date.now()-last.ts)/DAY, aNow=ageAt(Date.now());
  if(ago>(aNow!=null&&aNow<6?35:65)) out.push({l:'info',t:'La última medida fue hace '+Math.round(ago)+' días',d:'Agrega la del próximo control para mantener la curva al día.'});
  return out;
}

const MIN_DAYS=3, MIN_DAY_REC=3;
function dataDays(){ const t0=startOfDay(Date.now()); let n=0; for(let i=0;i<=14;i++) if(hasRec(t0-i*DAY)) n++; return n; }
function hasRec(ds){ const de=ds+DAY, now=Date.now();
  return S.events.some(e=>e.ts>=ds&&e.ts<de)||sleepInfo().periods.some(p=>p.ts<de&&(p.end||now)>ds); }
const median=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), k=s.length>>1; return s.length%2?s[k]:(s[k-1]+s[k])/2; };
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function fmtTOD(mins){ const d=new Date(); d.setHours(0,mins,0,0); return hm(d.getTime()); }
function sleepRef(a){ if(a==null) return null; if(a<4) return [14,17]; if(a<12) return [12,15]; if(a<=24) return [11,14]; return null; }
function wakeWindow(a){ if(a==null) return null;
  const t=[[1,35,60],[2,60,90],[4,75,120],[6,105,150],[8,120,180],[10,150,210],[14,180,240],[99,240,360]];
  const r=t.find(x=>a<x[0]); return [r[1],r[2]]; }
function feedInterval(from,to){
  const f=S.events.filter(e=>(e.type==='breast'||e.type==='bottle')&&e.ts>=from&&e.ts<to).map(e=>e.ts).sort((a,b)=>a-b);
  const iv=[]; for(let i=1;i<f.length;i++){ const d=f[i]-f[i-1]; if(d>=15*60000&&d<=8*36e5) iv.push(d); }
  return median(iv);
}
function analyze(){
  const t0=startOfDay(Date.now()), aNow=ageAt(Date.now());
  let cur=[],prev=[],partial=false;
  for(let i=1;i<=7;i++){ const d=t0-i*DAY; if(hasRec(d)) cur.push(d); }
  for(let i=8;i<=14;i++){ const d=t0-i*DAY; if(hasRec(d)) prev.push(d); }
  if(!cur.length&&hasRec(t0)){ cur=[t0]; partial=true; }
  const R={sleep:[],feed:[],diaper:[],health:[],days:cur.length,partial};
  if(!cur.length) return R;
  if(dataDays()<MIN_DAYS){ R.short=true; return R; }
  const from=Math.min(...cur), to=Math.max(...cur)+DAY;
  const ds=cur.map(dayStats), ps=prev.map(dayStats);
  const inR=e=>e.ts>=from&&e.ts<to;
  const nd=cur.length, dTxt=partial?'con lo registrado hoy (día incompleto)':'en '+nd+(nd===1?' día registrado':' días registrados');

  /* sueño */
  const avgSleep=mean(ds.map(d=>d.sleepMs));
  if(avgSleep>0){
    const ref=sleepRef(aNow), h=avgSleep/36e5;
    let l='info', d='';
    if(ref){ l=h>=ref[0]&&h<=ref[1]?'ok':'info'; d='Para su edad se recomiendan '+ref[0]+' a '+ref[1]+' h en 24 horas, contando siestas.'+(h<ref[0]?' Si faltó anotar algún sueño, el total se ve más bajo.':''); }
    if(ps.length){ const pa=mean(ps.map(x=>x.sleepMs)); if(pa>0){ const dm=Math.round((avgSleep-pa)/60000); if(Math.abs(dm)>=10) d+=' Frente a la semana anterior: '+(dm>0?'+':'−')+fmtDur(Math.abs(dm)*60000)+' por día.'; } }
    R.sleep.push({l,t:'Duerme en promedio '+fmtH(avgSleep)+' al día',d:d.trim()+' ('+dTxt+').'});
  }
  const sess=sleepInfo().periods.filter(p=>p.end&&inR(p));
  if(sess.length){
    const lg=sess.reduce((a,b)=>(b.end-b.ts)>(a.end-a.ts)?b:a);
    R.sleep.push({l:'info',t:'Su sueño más largo seguido: '+fmtDur(lg.end-lg.ts),d:dayLabel(lg.ts)+', desde las '+hm(lg.ts)+'. Promedio de cada periodo de sueño: '+fmtDur(mean(sess.map(s=>s.end-s.ts)))+'.'});
    let night=0,tot=0;
    sess.forEach(s=>{ for(let t=s.ts;t<s.end;t+=60000){ const h=new Date(t).getHours(); tot++; if(h>=19||h<7) night++; } });
    if(tot) R.sleep.push({l:'info',t:Math.round(night/tot*100)+' % de su sueño fue de noche',d:'Se cuenta como noche de 7 pm a 7 am. '+(aNow!=null&&aNow<3?'En los primeros meses es normal que el sueño se reparta entre día y noche.':'Con los meses, el sueño tiende a concentrarse en la noche.')});
    const bed=sess.filter(s=>{ const h=new Date(s.ts).getHours(); return h>=18&&(s.end-s.ts)>=2*36e5; }).map(s=>{ const d=new Date(s.ts); return d.getHours()*60+d.getMinutes(); });
    if(bed.length>=2) R.sleep.push({l:'info',t:'Suele dormirse de noche cerca de las '+fmtTOD(Math.round(mean(bed))),d:'Calculado con '+bed.length+' noches. Una rutina con hora parecida cada día ayuda a regular el sueño.'});
  }

  /* comida */
  const avgFeeds=mean(ds.map(d=>d.breast+d.bottle));
  const iv=feedInterval(from,to);
  if(avgFeeds>0){
    const brAny=ds.some(d=>d.breast>0);
    let l='info', d=iv?'Tiempo típico entre tomas: '+fmtDur(iv)+'.':'';
    if(brAny&&aNow!=null&&aNow<3){ l=avgFeeds>=8&&avgFeeds<=12?'ok':'info'; d+=' Con pecho, en los primeros meses lo habitual son 8 a 12 tomas al día.'; }
    R.feed.push({l,t:nf(avgFeeds)+' tomas al día en promedio (pecho y biberón)',d:d.trim()});
  }
  const br=S.events.filter(e=>e.type==='breast'&&e.end&&inR(e));
  if(br.length){
    const mins=s=>br.filter(e=>e.side===s).reduce((a,e)=>a+(e.end-e.ts),0), li=mins('izq'), de=mins('der'), tot=li+de;
    const pl=tot?Math.round(li/tot*100):50;
    const lastB=S.events.find(e=>e.type==='breast');
    R.feed.push({l:Math.abs(pl-50)>15?'info':'ok',t:'Pecho: '+fmtDur(mean(br.map(e=>e.end-e.ts)))+' por toma en promedio',
      d:'Tiempo por lado: izquierdo '+pl+' %, derecho '+(100-pl)+' %. '+(Math.abs(pl-50)>15?'Conviene alternar más los lados. ':'Los lados están equilibrados. ')+(lastB?'La última toma fue del lado '+SIDE[lastB.side]+'.':'')});
  }
  const avgMl=mean(ds.map(d=>d.ml));
  if(avgMl>0){
    const bt=S.events.filter(e=>e.type==='bottle'&&inR(e));
    const mat=bt.filter(e=>e.kind==='materna').reduce((a,e)=>a+(e.ml||0),0), all=bt.reduce((a,e)=>a+(e.ml||0),0);
    let d='Promedio por biberón: '+nf(mean(bt.map(e=>e.ml||0)),0)+' ml. '+(all?Math.round(mat/all*100)+' % leche materna, '+(100-Math.round(mat/all*100))+' % fórmula.':'');
    if(ps.length){ const pm=mean(ps.map(x=>x.ml)); if(pm>0){ const dd=avgMl-pm; if(Math.abs(dd)>=20) d+=' Frente a la semana anterior: '+(dd>0?'+':'−')+nf(Math.abs(dd),0)+' ml por día.'; } }
    const lastW=[...S.growth].reverse().find(g=>g.kg!=null);
    if(!br.length&&lastW&&aNow!=null&&aNow<6) d+=' Referencia general solo con biberón: unos '+nf(Math.min(950,lastW.kg*150),0)+' ml al día (150 ml por kg, máximo cerca de 950 ml). Tu pediatra puede darte la cifra exacta.';
    R.feed.push({l:'info',t:'Biberón: '+nf(avgMl,0)+' ml al día en promedio',d:d.trim()});
  }
  const sol=S.events.filter(e=>e.type==='solid'&&e.ts>=Date.now()-14*DAY);
  if(sol.length){
    const foods=[...new Set(sol.map(e=>(e.food||'').trim().toLowerCase()).filter(Boolean))];
    R.feed.push({l:aNow!=null&&aNow<5.5?'info':'ok',t:sol.length+(sol.length===1?' comida sólida':' comidas sólidas')+' en 14 días',
      d:(foods.length?'Alimentos: '+foods.slice(0,12).join(', ')+'. ':'')+(aNow!=null&&aNow<5.5?'La OMS recomienda empezar los sólidos alrededor de los 6 meses; confírmalo con el pediatra.':'Ofrecer un alimento nuevo a la vez ayuda a notar si alguno le cae mal.')});
  }

  /* pañales */
  const avgD=mean(ds.map(d=>d.diapers));
  if(avgD>0){
    const wet=mean(ds.map(d=>d.pipi)), dirty=mean(ds.map(d=>d.popo));
    const ok=aNow==null||aNow<0.25||wet>=6;
    R.diaper.push({l:ok?'ok':'warn',t:nf(avgD)+' pañales al día en promedio',
      d:nf(wet)+' con pipí y '+nf(dirty)+' con popó por día. '+(ok?'Seis o más pañales mojados al día suele indicar que come lo suficiente.':'Lo habitual son 6 o más pañales mojados al día. Si no es por falta de registros, coméntalo con el pediatra.')});
  }
  const lastPoo=S.events.find(e=>e.type==='diaper'&&e.kind!=='pipi');
  if(lastPoo) R.diaper.push({l:'info',t:'Último popó hace '+fmtDur(Date.now()-lastPoo.ts),d:'Con lactancia materna puede pasar varios días sin popó y ser normal, si está tranquilo y come bien.'});

  /* salud */
  const fev=S.events.filter(e=>e.type==='fever'&&e.ts>=Date.now()-7*DAY);
  if(fev.length){
    const mx=fev.reduce((a,b)=>b.temp>a.temp?b:a), recent=fev.filter(e=>e.ts>=Date.now()-48*36e5&&e.temp>=38);
    let l='ok',d='Máxima: '+nf(mx.temp)+' °C ('+dayLabel(mx.ts)+', '+hm(mx.ts)+').';
    if(recent.length){ l='warn'; d+=aNow!=null&&aNow<3?' En bebés menores de 3 meses, 38 °C o más es motivo para consultar al médico de inmediato.':' Hubo fiebre (38 °C o más) en las últimas 48 horas. Consulta si dura más de 2 o 3 días, si está muy decaído o si te preocupa.'; }
    R.health.push({l,t:fev.length+(fev.length===1?' toma de temperatura':' tomas de temperatura')+' en 7 días',d});
  }
  const meds=S.events.filter(e=>e.type==='med'&&e.ts>=Date.now()-7*DAY);
  if(meds.length){
    const by={}; meds.forEach(e=>{ const k=(e.name||'Medicina').trim(); (by[k]=by[k]||[]).push(e); });
    Object.keys(by).forEach(k=>{ const a=by[k], last=a[0]; R.health.push({l:'info',t:k+': '+a.length+(a.length===1?' dosis':' dosis')+' en 7 días',d:'Última: '+dayLabel(last.ts)+', '+hm(last.ts)+(last.dose?' ('+last.dose+')':'')+'. Sigue siempre la indicación del pediatra.'}); });
  }
  const vac=S.events.filter(e=>e.type==='vaccine');
  if(vac.length) R.health.push({l:'info',t:vac.length+(vac.length===1?' vacuna registrada':' vacunas registradas'),d:'Última: '+(vac[0].name||'vacuna')+', '+new Date(vac[0].ts).toLocaleDateString('es',{day:'numeric',month:'long'})+'. Revisa el carné para la próxima dosis.'});
  return R;
}
function homeInsights(){
  const out=[], now=Date.now(), aNow=ageAt(now);
  const fev=S.events.find(e=>e.type==='fever'&&e.temp>=38&&e.ts>=now-48*36e5);
  if(fev) out.push({l:'warn',t:'Fiebre de '+nf(fev.temp)+' °C '+dayLabel(fev.ts).toLowerCase()+' a las '+hm(fev.ts),d:aNow!=null&&aNow<3?'En menores de 3 meses, 38 °C o más es motivo para consultar al médico de inmediato.':'Vigila cómo sigue y consulta si te preocupa.'});
  if(dataDays()<MIN_DAYS){ if(!out.length) out.push({l:'info',t:'Aún faltan datos para sacar conclusiones',d:'Se necesitan registros de al menos '+MIN_DAYS+' días (llevas '+dataDays()+'). Mientras tanto no se muestran avisos ni promedios.'}); return out; }
  const os=openSleep();
  if(!os){
    const lastEnd=lastWakeObj(), ww=wakeWindow(aNow);
    if(lastEnd&&ww){ const m=(now-lastEnd.end)/60000;
      out.push({l:m>ww[1]?'warn':'info',t:'Lleva despierto '+fmtDur(now-lastEnd.end),d:'A su edad, el tiempo despierto entre sueños suele ser de '+fmtDur(ww[0]*60000)+' a '+fmtDur(ww[1]*60000)+'. '+(m>ww[1]?'Puede estar cansado: busca señales de sueño.':(m>=ww[0]?'Pronto puede tener sueño.':''))}); }
  }
  const iv=feedInterval(now-7*DAY,now), lf=S.events.find(e=>e.type==='breast'||e.type==='bottle');
  if(iv&&lf){ const next=lf.ts+iv; out.push({l:next<now?'warn':'info',t:next<now?'Ya pasó su intervalo habitual entre tomas':'Próxima toma cerca de las '+hm(next),d:'Suele comer cada '+fmtDur(iv)+'; la última toma empezó a las '+hm(lf.ts)+'.'}); }
  const lb=S.events.find(e=>e.type==='breast');
  if(lb&&!openBreast()) out.push({l:'info',t:'Siguiente pecho: '+(lb.side==='izq'?'derecho':'izquierdo'),d:'La última toma fue del lado '+SIDE[lb.side]+', a las '+hm(lb.ts)+'.'});
  return out;
}

    ['kg','cm','head'].forEach(m=>{ if(g[m]!=null){ o[m]=g[m]; const r=a!=null?lmsAt(sex,m,a):null; if(r) o['percentil_'+m]=pctText(zOf(g[m],r)); } }); return o; });
  const A=analyze(), hallazgos=[].concat(A.sleep,A.feed,A.diaper,A.health,...['kg','cm','head'].map(growthInsights)).map(x=>x.t+(x.d?' — '+x.d:''));

}
async function runAI(){
  if(S.ai.busy) return;
  if(dataDays()<MIN_DAYS){ S.ai={busy:false,text:'',err:'Aún no hay datos suficientes para analizar: se necesitan registros de al menos '+MIN_DAYS+' días.'}; render(); return; }
  let sample=null; try{ sample=await claude.use('sample'); }catch(e){}
  if(!sample){ S.ai={busy:false,text:'',err:'El análisis con Claude no está disponible en esta vista.'}; render(); return; }
  S.ai={busy:true,text:'',err:''}; render();
  const prompt='Eres un asistente que ayuda a padres a entender el registro de su bebé. Escribe en español, con tono cálido y claro, frases cortas. '
   +'Analiza SOLO los datos de abajo (registros de los últimos 14 días, medidas de crecimiento con percentiles OMS y hallazgos ya calculados). '
   +'Estructura: un párrafo de resumen general; luego secciones con "## " para Sueño, Alimentación, Pañales, Salud y Crecimiento (omite las que no tengan datos); '
   +'en cada una, 2 a 4 viñetas con "- " con patrones, tendencias o cambios entre días que veas en los números; al final "## Para comentar con el pediatra" con lo que valga la pena preguntar (si no hay nada, dilo). '
   +'No diagnostiques ni indiques dosis de medicamentos. Si un dato parece incompleto (días con pocos registros o el día de hoy), dilo en vez de sacar conclusiones. No inventes datos. Máximo 350 palabras.\n\nDATOS:\n'+JSON.stringify(aiPayload());
  try{
    const r=await sample(prompt,{modelTier:'default',onText:({text})=>{ S.ai.text=text; const el=document.getElementById('aitext'); if(el) el.innerHTML=md(text); }});
    S.ai={busy:false,text:r.text||S.ai.text,err:''};
  }catch(e){
    S.ai={busy:false,text:(e&&e.text)||'',err:e&&e.code==='rate_limited'?'Se hicieron muchas consultas seguidas. Espera un momento y vuelve a intentar.':(e&&e.code==='not_granted'?'No diste permiso para consultar a Claude.':'No se pudo generar el análisis. Intenta de nuevo.')};
  }
  render();
}
function md(t){
  let h=esc(t).split('\n').map(l=>{ if(/^#{1,4}\s/.test(l)) return '<h4>'+l.replace(/^#{1,4}\s/,'')+'</h4>'; if(/^\s*[-•*]\s/.test(l)) return '<li>'+l.replace(/^\s*[-•*]\s/,'')+'</li>'; return l.trim()?'<p>'+l+'</p>':''; }).join('');
  return h.replace(/(?:<li>.*?<\/li>)+/g,m=>'<ul>'+m+'</ul>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

/* ---------- aviso con deshacer ---------- */
let toastTimer=null;
function pushUndo(label,fn,redo){
  S.undo.push({label,fn,redo}); S.redo=[]; if(S.undo.length>30) S.undo.shift(); render();
}
let undoing=false;
async function undoLast(){
  if(undoing) return;
  const u=S.undo.pop();
  if(!u){ toast('No hay nada para deshacer'); render(); return; }
  undoing=true;
  try{
    if(u.redo){ await u.fn(); S.redo.push({label:u.label,fn:u.redo,undo:u.fn}); }
    else { const list=await capture(u.fn); S.redo.push({label:u.label,fn:()=>replay(list)}); }
    toast('Deshecho: '+u.label);
  }
  catch(e){ S.undo.push(u); }
  finally{ undoing=false; render(); }
}
async function redoLast(){
  if(undoing) return;
  const r=S.redo.pop();
  if(!r){ toast('No hay nada para rehacer'); render(); return; }
  undoing=true;
  try{
    if(r.undo){ await r.fn(); S.undo.push({label:r.label,fn:r.undo,redo:r.fn}); }
    else { const list=await capture(r.fn); S.undo.push({label:r.label,fn:()=>replay(list)}); }
    toast('Rehecho: '+r.label);
  }
  catch(e){ S.redo.push(r); }
  finally{ undoing=false; render(); }
}
function toast(msg,undo,redo){
  const root=$('#toastroot'); clearTimeout(toastTimer);
  root.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-undo="1">Deshacer</button>':'')+'</div>';
  if(typeof undo==='function') pushUndo(msg,undo,redo);
  const ms=undo?6000:3500;
  toastTimer=setTimeout(()=>dismissToast(),ms);
  const el=root.querySelector('.toast'); let y0=null, dy=0;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; y0=e.clientY; dy=0; el.setPointerCapture(e.pointerId); el.classList.add('dragging'); clearTimeout(toastTimer); });
  el.addEventListener('pointermove',e=>{ if(y0==null) return; dy=e.clientY-y0; const d=dy<0?dy*0.25:dy; el.style.transform='translate(-50%,'+d+'px)'; el.style.opacity=String(Math.max(0,1-Math.max(0,dy)/140)); });
  const end=()=>{ if(y0==null) return; y0=null; el.classList.remove('dragging');
    if(dy>35) dismissToast(); else { el.style.transform=''; el.style.opacity=''; toastTimer=setTimeout(()=>dismissToast(),ms); } };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}
function dismissToast(){
  const root=$('#toastroot'), el=root.querySelector('.toast'); if(!el) return;
  el.style.transform=''; el.style.opacity=''; el.classList.add('gone'); setTimeout(()=>{ if(root.contains(el)) root.innerHTML=''; },260);
}

  ['2026.11.26-5','26 de noviembre',[
    ['heart','Cuando se juntan muchos cambios, este letrero muestra solo los más importantes; puedes ver todos con un botón.',2],

  ['2026.11.26-4','26 de noviembre',[

const LEVELS={3:['Importante','health'],2:['Mejora','accent'],1:['Detalle','muted']};
const VKEY='diario-version-vista';
function showNews(fromVer,all){
  const groups=CHANGELOG.filter(c=>!fromVer||c[0]>fromVer), list=groups.length?groups:CHANGELOG.slice(0,1);
  const items=[]; list.forEach(c=>c[2].forEach(x=>items.push({i:x[0],t:x[1],l:x[2]||1,d:c[1]})));
  const MAX=4, many=items.length>MAX;
  const li=x=>{ const L=LEVELS[x.l]; return '<li>'+ic(x.i)+'<span><span class="lvl" style="--lc:var(--'+L[1]+')">'+L[0]+'</span>'+esc(x.t)+'</span></li>'; };
  let body;
  if(many&&!all){
    const top=items.slice().sort((a,b)=>b.l-a.l).slice(0,MAX);
    body='<p class="kphint">Hay '+items.length+' cambios desde la última vez. Estos son los más importantes:</p><ul class="newslist">'+top.map(li).join('')+'</ul>'
      +'<button type="button" class="ghost" data-newsall="'+esc(fromVer==null?'':fromVer)+'">Ver todos los cambios ('+items.length+')</button>';
  } else {
    body=list.map(c=>'<div class="newsgrp"><div class="sec" style="margin:6px 0">'+esc(c[1])+' · versión '+esc(c[0])+'</div><ul class="newslist">'+c[2].map(x=>li({i:x[0],t:x[1],l:x[2]||1})).join('')+'</ul></div>').join('');
  }
  S.sheet={news:true};
  document.getElementById('sheetroot').innerHTML='<div class="back" id="back"><div class="sheet newsheet" role="dialog" aria-modal="true" aria-label="Novedades">'
    +'<div class="newstop"><span class="newsbadge">'+ic('heart')+'</span><div><h2>'+(fromVer!=null?'¡App actualizada!':'Novedades')+'</h2><p class="kphint">Versión '+esc(APP_VERSION)+'</p></div></div>'
    +body+'<div class="acts"><button type="button" class="primary" data-close="1">Entendido</button></div></div></div>';
}
function checkNews(){
  let seen=null; try{ seen=localStorage.getItem(VKEY); }catch(e){}
  if(seen===APP_VERSION) return;
  try{ localStorage.setItem(VKEY,APP_VERSION); }catch(e){}
  if(!seen) return; // recién instalada o primera vez: no mostrar novedades
  const go=()=>{ if(document.getElementById('splash')) return setTimeout(go,300); if(S.sheet) return setTimeout(go,1500); showNews(seen||''); };
  setTimeout(go,400);
}
async function checkUpdate(){
  try{
    const r=await fetch(location.href.split('#')[0],{cache:'no-store'}); if(!r.ok) return false;
    const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){
      toast('Hay una versión nueva. Actualizando…');
      try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(e){}
      try{ sessionStorage.setItem('diario-sin-inicio','1'); }catch(e){}
      setTimeout(()=>location.reload(),700); return true;
    }
  }catch(e){}
  return false;
}

/* ---------- scroll: ocultar la barra de navegación y pausar efectos ---------- */
(function(){
  let t=null, raf=false;
  window.addEventListener('scroll',()=>{
    if(raf) return; raf=true;
    requestAnimationFrame(()=>{
      raf=false;
      const nav=document.querySelector('.nav');
      document.documentElement.classList.toggle('scrolled',window.scrollY>40);
      document.documentElement.classList.add('scrolling');
      clearTimeout(t);
      t=setTimeout(()=>{ document.documentElement.classList.remove('scrolling'); },700);
    });
  },{passive:true});
})();

/* ---------- jalar hacia abajo para actualizar ---------- */
async function refreshAll(){
  if(S.db){
    const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
    const [ev,gr,pr]=await Promise.race([Promise.all([
      S.db.collection('events').orderBy('ts','desc').limit(1000).get(),
      S.db.collection('growth').orderBy('ts','asc').limit(500).get(),
      S.db.doc('meta/profile').get()]),t]);
    S.events=ev.docs.map(snapData); S.growth=gr.docs.map(snapData); S.profile=pr.exists?pr.data():{};
    S.slow=false; S.synced=true; resolveNames();
  } else { loadLocal(); sortAll(); }
  render();
}
(function(){
  const el=document.getElementById('ptr'), TH=75, MAX=120;
  let y0=null, dy=0, busy=false;
  const set=(d,o)=>{ el.style.transform='translateY('+(d-50)+'px)'; el.style.opacity=o; el.querySelector('svg').style.transform=busy?'':'rotate('+(d*3)+'deg)'; };
  const onMove=e=>{
    if(y0==null) return;
    const d=e.touches[0].clientY-y0;
    if(d<=0||window.scrollY>0){ dy=0; set(0,0); if(d<-6){ y0=null; document.removeEventListener('touchmove',onMove); } return; }
    dy=Math.min(MAX,d*0.5); set(dy,Math.min(1,dy/TH));
    if(e.cancelable) e.preventDefault();
  };
  document.addEventListener('touchstart',e=>{
    if(busy||S.sheet||window.scrollY>0||e.touches.length!==1||e.target.closest('.sheet,.cbox,input,.toast')){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; el.classList.remove('anim');
    document.addEventListener('touchmove',onMove,{passive:false});
  },{passive:true});
  document.addEventListener('touchend',async()=>{
    document.removeEventListener('touchmove',onMove);
    if(y0==null) return; y0=null; el.classList.add('anim');
    if(dy<TH){ set(0,0); return; }
    busy=true; el.classList.add('spin'); set(70,1);
    try{ if(await checkUpdate()) return; await refreshAll(); if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){} toast('Actualizado · tienes la última versión'); }
    catch(e){ toast('No se pudo actualizar. Revisa la conexión.'); }
    finally{ busy=false; el.classList.remove('spin'); set(0,0); }
  });
})();

checkNews();
document.documentElement.classList.add('noclaude');
window.nubeMsg=function(c,d){ const w=(window.nubeWho&&window.nubeWho())||'Alguien'; if(c==='growth') return w+' anotó una medida'; const f=evInfo(d); return w+' registró: '+f.t+(f.s?' · '+f.s:''); };
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
init();
})();
