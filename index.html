<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario de Luciano</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2457D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Archivo+Black&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Una sola columna tipo app móvil: estado arriba, botones grandes de un toque, navegación inferior. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#16202E; --muted:#667487; --line:#E1E7EF;
  --accent:#2457D6; --accent-ink:#FFFFFF;
  --sleep:#5A55D2; --feed:#D9820F; --diaper:#2A9468; --health:#D2493F; --grow:#0E87A3;
  --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#18202F; --ink:#EAF0F8; --muted:#92A0B5; --line:#2A3447;
    --accent:#6C93FF; --accent-ink:#0B1020;
    --sleep:#9A96FF; --feed:#F3A93D; --diaper:#4FCB93; --health:#FF7C70; --grow:#4BC4DE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#18202F; --ink:#EAF0F8; --muted:#92A0B5; --line:#2A3447;
  --accent:#6C93FF; --accent-ink:#0B1020;
  --sleep:#9A96FF; --feed:#F3A93D; --diaper:#4FCB93; --health:#FF7C70; --grow:#4BC4DE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;padding:16px 16px 104px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:28px;line-height:1.1}
.top .age{color:var(--muted);font-weight:500;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:color-mix(in srgb,var(--feed) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--feed) 40%,var(--line))}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 11px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tile .v{font-family:var(--font-display);font-size:19px;font-weight:700;margin-top:3px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sec{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.act{--c:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:12px 8px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--ink);font-weight:700;text-align:center;line-height:1.15}
.act .ic{color:var(--c);width:26px;height:26px}
.act small{font-weight:500;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.act:active{transform:scale(.97)}
.act.on{background:var(--c);border-color:var(--c);color:#fff}
.act.on .ic,.act.on small{color:#fff}
.act.on{animation:pulse 2s ease-in-out infinite}

@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}}
.act.big{min-height:104px;flex-direction:row;gap:14px;font-size:20px;font-family:var(--font-display)}
.act.big .ic{width:34px;height:34px}
.act.big small{font-size:14px;display:block;font-family:var(--font-body)}
.c-sleep{--c:var(--sleep)}.c-feed{--c:var(--feed)}.c-diaper{--c:var(--diaper)}.c-health{--c:var(--health)}.c-grow{--c:var(--grow)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rowmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 4px 10px 12px;color:inherit}
.rowdel{flex:none;width:48px;align-self:stretch;min-height:56px;border:0;background:none;color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;transition:width .15s,background .15s}
.rowedit{flex:none;width:42px;align-self:stretch;min-height:56px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.rowedit .ic{width:19px;height:19px}
.row .nt{font-size:12.5px;color:var(--ink);opacity:.8;font-style:italic;margin-top:2px;overflow-wrap:anywhere}
.rowdel.armed{width:88px;background:var(--health);color:#fff}
.rowdel .ic{width:20px;height:20px}
.row .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);flex:none}
.row .dot .ic{width:21px;height:21px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row .r{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.dayh{font-family:var(--font-display);font-size:16px;margin:18px 0 8px;text-transform:capitalize}
.empty{color:var(--muted);text-align:center;padding:26px 8px;border:1.5px dashed var(--line);border-radius:16px}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 10px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px;min-height:52px}
.nav button[aria-current="page"]{color:var(--accent)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav strong{font-family:var(--font-display);font-size:19px;text-transform:capitalize;text-align:center;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat .k .ic{width:16px;height:16px;color:var(--c)}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.card h3{font-size:16px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:6px;height:118px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--c);min-height:3px}
.bar span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.bar.sel i{outline:2px solid var(--ink);outline-offset:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chips button,.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.seg button.on,.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{padding:8px 12px;min-height:40px}
.pills{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pill{padding:8px 14px;min-height:40px}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--grow);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.primary{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:54px;font-size:17px}
.ghost{width:100%;border:1.5px solid var(--line);border-radius:16px;background:none;min-height:50px;font-weight:600}
.danger{width:100%;border:1.5px solid color-mix(in srgb,var(--health) 50%,var(--line));border-radius:16px;background:none;color:var(--health);min-height:50px;font-weight:700}
.back{position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:22px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=datetime-local]{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:17px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:6px 4px;min-height:36px}
.growthlist .row .dot{--c:var(--grow)}
.mt{margin-top:12px}
.noclaude .aicard{display:none}
.altbtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:transparent;text-align:left;color:var(--ink)}
.altbtn .ic{color:var(--c);width:22px;height:22px}
.altbtn b{display:block;font-size:15px}.altbtn small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.gapbig{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:4px}
.gapbig span{font-family:var(--font-display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.gapbig small{color:var(--muted);font-weight:600;text-transform:capitalize}
.gapseg{display:flex;height:40px;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:12.5px;font-weight:700}
.gapseg span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:flex-grow .05s}
.gs-sleep{background:var(--sleep);color:#fff}.gs-awake{background:color-mix(in srgb,var(--feed) 25%,var(--surface));color:var(--ink)}
#gaprange{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
#gaprange::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--accent) 0 var(--p),var(--line) var(--p) 100%)}
#gaprange::-moz-range-track{height:12px;border-radius:6px;background:var(--line)}
#gaprange::-moz-range-progress{height:12px;border-radius:6px;background:var(--accent)}
#gaprange::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:var(--bg);border:4px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#gaprange::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--bg);border:4px solid var(--accent)}
.flipopt{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700}
.flipopt .fo-a{flex:1}.flipopt .fo-b{flex:1;text-align:right;color:var(--sleep)}
.flipopt .fo-arrow .ic{color:var(--sleep)}
.newstop{display:flex;align-items:center;gap:12px}
.newstop h2{margin:0}.newstop p{margin:2px 0 0}
.newsbadge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sleep),var(--accent));color:#fff;flex:none;animation:sp-pop .5s cubic-bezier(.2,1.5,.4,1) both}
.newsbadge .ic{width:28px;height:28px;fill:#fff;stroke:none}
.newslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.newslist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.4;animation:rise .4s ease both}
.newslist li:nth-child(2){animation-delay:.08s}.newslist li:nth-child(3){animation-delay:.16s}
.lvl{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.newslist .ic{color:var(--accent);width:20px;height:20px;margin-top:1px}
.gapends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.gapends b{display:block;color:var(--ink);font-size:13px}
.gapfine{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gapfine button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;padding:0 2px}
.hbtns{display:flex;gap:8px}
.cback{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:20px}
.cbox{width:100%;max-width:360px;background:var(--bg);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .2s ease}
.cbox h3{font-family:var(--font-display);font-size:20px;margin:0 0 8px}
.cbox p{margin:0 0 16px;color:var(--muted);line-height:1.45}
.cacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cacts button{min-height:50px}
.dangerfill{width:100%;border:0;border-radius:16px;background:var(--health);color:#fff;font-weight:700;min-height:54px;font-size:16px}
.dangerfill:disabled{opacity:.45}
.kpd{display:flex;gap:6px;flex-wrap:wrap}
.kf{flex:1 1 56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:62px}
.kf small{font-size:11.5px;color:var(--muted);font-weight:700}
.kf b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.kf.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kp button:active{transform:scale(.96);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.kp .kpnext{font-size:15px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kphint{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.kphint.bad{color:var(--health);font-weight:600}
.rzsum{display:flex;flex-direction:column;gap:3px}
.rzsum span{font-size:13px;color:var(--muted)}
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:0;z-index:15;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--bg);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;transform:translateY(-60px);opacity:0;pointer-events:none}
#ptr svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ptr.anim{transition:transform .25s ease,opacity .25s ease}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){#ptr.spin svg{animation:none}}
.inslist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ins{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:14px;padding:10px 12px}
.ins .chip{flex:none;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);border-radius:8px;padding:3px 7px;margin-top:1px}
.ins .it{font-weight:700;line-height:1.3}
.ins .id{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.card .inslist .ins{background:transparent}
.legend i.band{border-top:0;height:10px;width:18px;background:color-mix(in srgb,var(--grow) 22%,transparent);border-radius:2px}
.aicard{border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.aitext{font-size:15px;line-height:1.5}
.aitext h4{font-family:var(--font-display);font-size:16px;margin:14px 0 4px}
.aitext p{margin:6px 0}.aitext ul{margin:4px 0;padding-left:20px}.aitext li{margin:3px 0}
.primary:disabled{opacity:.6}
.undobtn{position:relative}
.undobtn.off{opacity:.4}
.undobtn .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.skinbtn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:4px 2px;border:0;background:none;min-height:44px;position:relative}
.skinbtn .sw{width:72px;height:72px;border-radius:50%;border:4px solid;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:transform .2s}
.skinbtn b{font-size:13.5px;line-height:1.2}
.skinbtn small{color:var(--muted);font-size:11.5px;line-height:1.2}
.skinbtn.on .sw{transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.skinbtn.on::after{content:"✓";position:absolute;top:0;left:calc(50% + 20px);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:grid;place-items:center}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;margin-top:6px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:56px}
.switchrow b{display:block}.switchrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.switch{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}

/* ===== Skin: Selva ===== */
:root[data-skin="selva"]{--bg:#F3EBD8;--surface:#FFFBF1;--ink:#20321F;--muted:#677459;--line:#E2D6B8;--accent:#2F6B3A;--accent-ink:#FFFBF1;--sleep:#4F5BA8;--feed:#B8670F;--diaper:#3E8E4E;--health:#C2453A;--grow:#1F7F86;--font-display:'DM Serif Display',Georgia,serif;color-scheme:light}

/* ===== Animaciones suaves (se apagan con html.noanim) ===== */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;display:block}
/* brillo que recorre botones principales y el botón activo */
.primary,.act.on{position:relative;overflow:hidden}
.primary::after,.act.on::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:sheen 5.5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,62%{left:-60%}100%{left:130%}}
/* los íconos de los botones respiran apenas */
.act .ic{animation:breathe 4.5s ease-in-out infinite}
.act:nth-child(2n) .ic{animation-delay:-1.5s}.act:nth-child(3n) .ic{animation-delay:-3s}
@keyframes breathe{50%{transform:translateY(-1.5px) scale(1.05)}}
/* el nombre del bebé cambia de color muy despacio */
.top h1{background:linear-gradient(90deg,var(--ink),var(--accent),var(--sleep),var(--ink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:hue 14s ease-in-out infinite}
@keyframes hue{50%{background-position:100% 0}}
/* aparición suave al cambiar de pestaña o abrir hojas */
.status,.sec,.grid,.list,.card,.inslist{animation:rise .45s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}}
.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* Clásico: auroras de color difuminadas */
html:not([data-skin]) body{background:transparent}
html:not([data-skin]) #fx i{width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);opacity:.16}
html:not([data-skin]) #fx i:nth-child(1){background:var(--accent);top:-30vmax;left:-20vmax;animation:float1 22s ease-in-out infinite alternate}
html:not([data-skin]) #fx i:nth-child(2){background:var(--sleep);top:20vh;right:-35vmax;animation:float2 26s ease-in-out infinite alternate}
html:not([data-skin]) #fx i:nth-child(3){background:var(--feed);bottom:-40vmax;left:0;opacity:.10;animation:float1 30s ease-in-out infinite alternate-reverse}
@keyframes float1{to{transform:translate(12vmax,8vmax) scale(1.1)}}
@keyframes float2{to{transform:translate(-10vmax,-6vmax) scale(.92)}}

/* Noche: estrellas fugaces y luna que brilla */
[data-skin="noche"] #fx i:nth-child(-n+3){top:0;left:0;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 9s ease-in infinite}
[data-skin="noche"] #fx i:nth-child(1){top:12%;left:55%;animation-delay:2s}
[data-skin="noche"] #fx i:nth-child(2){top:28%;left:85%;animation-delay:6.5s;animation-duration:12s}
[data-skin="noche"] #fx i:nth-child(3){top:6%;left:25%;animation-delay:10s;animation-duration:15s}
@keyframes shoot{0%{opacity:0;transform:rotate(155deg) translateX(0)}2%{opacity:1}9%{opacity:0;transform:rotate(155deg) translateX(320px)}100%{opacity:0;transform:rotate(155deg) translateX(320px)}}
[data-skin="noche"] #fx i:nth-child(4){top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,107,.28),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.45;transform:scale(1.12)}}

/* Algodón: burbujas que suben */
[data-skin="algodon"] #fx i{bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 40%,transparent 70%),var(--bc);opacity:.45;animation:bubble linear infinite}
[data-skin="algodon"] #fx i:nth-child(1){--bc:#FFC7DE;left:8%;width:46px;height:46px;animation-duration:19s}
[data-skin="algodon"] #fx i:nth-child(2){--bc:#D8C9FF;left:32%;width:28px;height:28px;animation-duration:15s;animation-delay:-6s}
[data-skin="algodon"] #fx i:nth-child(3){--bc:#BFF0DF;left:58%;width:56px;height:56px;animation-duration:24s;animation-delay:-12s}
[data-skin="algodon"] #fx i:nth-child(4){--bc:#FFE3B8;left:80%;width:34px;height:34px;animation-duration:17s;animation-delay:-3s}
[data-skin="algodon"] #fx i:nth-child(5){--bc:#FFC7DE;left:92%;width:22px;height:22px;animation-duration:21s;animation-delay:-15s}
@keyframes bubble{0%{transform:translate(0,0)}50%{transform:translate(18px,-55vh)}100%{transform:translate(-10px,-115vh)}}

/* Océano: destellos de sol y burbujitas */
[data-skin="oceano"] #fx i:nth-child(1){top:-10%;left:-10%;width:120%;height:70%;background:repeating-linear-gradient(105deg,transparent 0 60px,rgba(255,255,255,.18) 60px 90px,transparent 90px 170px);filter:blur(6px);animation:rays 10s ease-in-out infinite alternate}
@keyframes rays{from{opacity:.4;transform:translateX(-20px)}to{opacity:.9;transform:translateX(20px)}}
[data-skin="oceano"] #fx i:nth-child(n+2){bottom:-30px;width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(10,143,166,.45);background:rgba(255,255,255,.4);animation:bubble linear infinite}
[data-skin="oceano"] #fx i:nth-child(2){left:15%;animation-duration:13s}
[data-skin="oceano"] #fx i:nth-child(3){left:45%;width:7px;height:7px;animation-duration:10s;animation-delay:-4s}
[data-skin="oceano"] #fx i:nth-child(4){left:70%;width:13px;height:13px;animation-duration:16s;animation-delay:-9s}
[data-skin="oceano"] #fx i:nth-child(5){left:88%;width:8px;height:8px;animation-duration:12s;animation-delay:-2s}

/* Selva: hojas que caen despacio y luz que se filtra */
[data-skin="selva"] #fx i:nth-child(-n+4){top:-40px;width:22px;height:22px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#8BB174,#3E8E4E);opacity:.5;animation:leaf linear infinite}
[data-skin="selva"] #fx i:nth-child(1){left:12%;animation-duration:20s}
[data-skin="selva"] #fx i:nth-child(2){left:48%;width:16px;height:16px;animation-duration:26s;animation-delay:-9s;background:linear-gradient(135deg,#D9B26A,#B8670F)}
[data-skin="selva"] #fx i:nth-child(3){left:76%;animation-duration:23s;animation-delay:-15s}

@keyframes leaf{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(30px,28vh) rotate(90deg)}50%{transform:translate(-20px,55vh) rotate(170deg)}75%{transform:translate(25px,82vh) rotate(260deg)}100%{transform:translate(0,112vh) rotate(360deg)}}
[data-skin="selva"] #fx i:nth-child(5){top:-20%;right:-20%;width:80vw;height:80vw;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.35),transparent 60%);animation:glow 8s ease-in-out infinite alternate}

/* Retro: figuras que flotan y cambian de color */
[data-skin="retro"] #fx i{width:26px;height:26px;border:2.5px solid #111;opacity:.55;animation:retro 14s ease-in-out infinite alternate,cycle 9s steps(1) infinite}
[data-skin="retro"] #fx i:nth-child(1){top:14%;right:6%;border-radius:50%}
[data-skin="retro"] #fx i:nth-child(2){top:46%;left:3%;transform:rotate(45deg);animation-delay:-4s,-3s}
[data-skin="retro"] #fx i:nth-child(3){bottom:16%;right:10%;width:34px;height:14px;border-radius:7px;animation-delay:-8s,-6s}
[data-skin="retro"] #fx i:nth-child(4){top:70%;left:42%;width:18px;height:18px;border-radius:50%;animation-delay:-2s,-1s}
[data-skin="retro"] #fx i:nth-child(5){top:30%;left:60%;width:16px;height:16px;animation-delay:-11s,-5s}
@keyframes retro{to{transform:translate(14px,-22px) rotate(160deg)}}
@keyframes cycle{0%{background:#FFE14D}25%{background:#FF4F7B}50%{background:#2EC4F1}75%{background:#14C38E}}
[data-skin="retro"] .top h1{background:none;-webkit-text-fill-color:currentColor;animation:none;text-shadow:3px 3px 0 var(--accent)}



/* ===== Animación de inicio (3 s) ===== */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#splash.out{pointer-events:none}
/* Salida: cada elemento se va con movimiento */
#splash.out .sp-logo{animation:sp-out-logo .45s cubic-bezier(.5,-0.4,.7,.2) both}
#splash.out.out .sp-name span{animation:sp-out-letter .4s cubic-bezier(.5,-0.6,.8,.3) both}
#splash.out .sp-sub{animation:sp-out-down .35s cubic-bezier(.5,-0.5,.8,.3) .05s both}
#splash.out .sp-bar{animation:sp-out-down .35s cubic-bezier(.5,-0.5,.8,.3) .1s both}
@keyframes sp-out-logo{30%{transform:scale(1.15)}100%{transform:scale(0) rotate(-35deg)}}
@keyframes sp-out-letter{to{transform:translateY(-60px) scale(0) rotate(-25deg)}}
@keyframes sp-out-down{to{transform:translateY(90px) scale(.5)}}
#splash.sk-noche.out .sp-logo{animation:sp-out-up .5s cubic-bezier(.6,-0.3,.8,.4) both}
@keyframes sp-out-up{to{transform:translateY(-75vh) scale(.5) rotate(25deg)}}
#splash.sk-oceano.out .sp-name span{animation-name:sp-out-sink}
#splash.sk-oceano.out .sp-logo{animation:sp-out-sinklogo .5s cubic-bezier(.6,-0.4,.8,.4) both}
@keyframes sp-out-sink{to{transform:translateY(70px) scale(.3) rotate(15deg)}}
@keyframes sp-out-sinklogo{to{transform:translateY(60vh) scale(.4)}}
#splash.sk-selva.out .sp-logo{transform-origin:50% 100%;animation:sp-out-sprout .45s cubic-bezier(.5,-0.5,.8,.3) both}
@keyframes sp-out-sprout{30%{transform:scale(1.1,.9)}100%{transform:scale(1.3,0)}}
#splash.sk-retro.out .sp-name span{animation-name:sp-out-drop}
#splash.sk-retro.out .sp-logo{animation:sp-out-spin .5s cubic-bezier(.5,-0.5,.8,.3) both}
@keyframes sp-out-drop{to{transform:translateY(140px) rotate(35deg) scale(.6)}}
@keyframes sp-out-spin{to{transform:rotate(540deg) scale(0)}}
#splash.sk-algodon.out .sp-logo{animation:sp-out-puff .45s cubic-bezier(.5,-0.4,.7,.2) both}
@keyframes sp-out-puff{40%{transform:scale(1.35)}100%{transform:scale(0)}}
/* Revelado: el fondo se abre y deja ver la app */
#splash.reveal{animation:sp-iris .5s cubic-bezier(.7,0,.3,1) both}
@keyframes sp-iris{from{clip-path:circle(150% at 50% 42%)}to{clip-path:circle(0% at 50% 42%)}}
#splash.sk-noche.reveal{animation:sp-lift .55s cubic-bezier(.7,0,.3,1) both}
@keyframes sp-lift{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
#splash.sk-algodon.reveal{animation:sp-bubble .55s cubic-bezier(.6,-0.35,.7,1) both}
@keyframes sp-bubble{from{clip-path:circle(150% at 50% 36%)}to{clip-path:circle(0% at 50% 36%)}}
#splash.sk-oceano.reveal{animation:sp-drain .55s cubic-bezier(.7,0,.3,1) both}
@keyframes sp-drain{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
#splash.sk-selva.reveal{animation:sp-doors .55s cubic-bezier(.7,0,.3,1) both}
@keyframes sp-doors{from{clip-path:polygon(0 0,50% 0,50% 100%,50% 100%,50% 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(0 0,0 0,0 100%,100% 100%,100% 0,100% 0,100% 100%,0 100%)}}
#splash.sk-retro.reveal{animation:sp-slide .55s cubic-bezier(.6,-0.45,.7,1) both}
@keyframes sp-slide{to{transform:translate(120%,-12%) rotate(12deg)}}

.sp-core{position:absolute;inset:18px;border-radius:50%;background:var(--surface);box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 35%,transparent);display:grid;place-items:center}

.sp-dot{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;animation:sp-orbit 2.6s cubic-bezier(.5,0,.5,1) infinite}

.sp-bar{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:140px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}

.sp-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}

@keyframes n-rise{from{opacity:0;transform:translateY(46px) rotate(-25deg)}}

/* ---------- utilidades de tiempo ---------- */
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function hm(ts){ return new Date(ts).toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'}); }
function fmtDur(ms){
  ms=Math.max(0,ms); const m=Math.floor(ms/60000);
  if(m<1) return 'menos de 1 min';
  if(m<60) return m+' min';
  const h=Math.floor(m/60), mm=m%60;
  if(h<24) return h+' h'+(mm?' '+mm+' min':'');
  return Math.floor(h/24)+' d '+(h%24)+' h';
}
function fmtClock(ms){
  const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h? h+':'+p(m)+':'+p(x) : p(m)+':'+p(x);
}
function dayLabel(ts){
  const t=startOfDay(Date.now()), d=startOfDay(ts);
  if(d===t) return 'Hoy'; if(d===t-DAY) return 'Ayer';
  return new Date(ts).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
}
function toLocalInput(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function fromLocalInput(v){ const t=new Date(v).getTime(); return isNaN(t)?null:t; }
function ageText(){
  const b=S.profile.birth; if(!b) return 'Agrega la fecha de nacimiento';
  const bd=new Date(b+'T00:00:00'), now=new Date();
  if(bd>now) return 'Aún no nace';
  let m=(now.getFullYear()-bd.getFullYear())*12+now.getMonth()-bd.getMonth();
  let a=new Date(bd); a.setMonth(bd.getMonth()+m);
  if(a>now){ m--; a=new Date(bd); a.setMonth(bd.getMonth()+m); }
  const d=Math.floor((now-a)/DAY);
  if(m<1){
    const dd=Math.floor((now-bd)/DAY);
    if(dd<14) return dd+(dd===1?' día':' días');
    return Math.floor(dd/7)+' semanas y '+(dd%7)+(dd%7===1?' día':' días');
  }
  if(m>=24){ const y=Math.floor(m/12), r=m%12; return y+' años'+(r?' y '+r+(r===1?' mes':' meses'):''); }
  return m+(m===1?' mes':' meses')+(d?' y '+d+(d===1?' día':' días'):'');
}
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- datos: base compartida, o este dispositivo si no hay conexión ---------- */
const LKEY='diario-bebe-v1';
function loadLocal(){
  try{ const j0=JSON.parse(localStorage.getItem(LKEY)||'null'); if(!j0||!j0.profile||!j0.profile.name){ const j=j0||{events:[],growth:[]}; j.profile=Object.assign({name:'Luciano',sex:'nino'},j.profile||{}); localStorage.setItem(LKEY,JSON.stringify(j)); } }catch(e){}
  try{ const j=JSON.parse(localStorage.getItem(LKEY)||'null'); if(j){ S.events=j.events||[]; S.growth=j.growth||[]; S.profile=j.profile||{}; } }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LKEY,JSON.stringify({events:S.events,growth:S.growth,profile:S.profile})); }catch(e){}
}
function sortAll(){ S.events.sort((a,b)=>b.ts-a.ts); S.growth.sort((a,b)=>a.ts-b.ts); }
async function write(coll,id,obj){
  if(S.readonly){ toast('Solo tienes permiso de lectura. Pide que te compartan como colaborador.'); throw new Error('ro'); }
  obj=JSON.parse(JSON.stringify(obj));
  if(S.db){
    try{ await S.db.collection(coll).doc(id).set(obj); }
    catch(e){ toast('No se pudo guardar. Revisa la conexión e intenta de nuevo.'); throw e; }
  } else {
    const arr=coll==='events'?S.events:S.growth, i=arr.findIndex(x=>x.id===id);
    const rec=Object.assign({id},obj); if(i>=0) arr[i]=rec; else arr.push(rec);
    sortAll(); saveLocal(); render();
  }
}
async function remove(coll,id){
  if(S.readonly){ toast('Solo tienes permiso de lectura.'); throw new Error('ro'); }
  if(S.db){
    try{ await S.db.collection(coll).doc(id).delete(); }
    catch(e){ toast('No se pudo borrar. Intenta de nuevo.'); throw e; }
  } else {
    if(coll==='events') S.events=S.events.filter(x=>x.id!==id); else S.growth=S.growth.filter(x=>x.id!==id);
    saveLocal(); render();
  }
}
async function saveProfile(p){
  if(S.readonly){ toast('Solo tienes permiso de lectura.'); throw new Error('ro'); }
  if(S.db){ try{ await S.db.doc('meta/profile').set(p); }catch(e){ toast('No se pudo guardar el perfil.'); throw e; } }
  else { S.profile=p; saveLocal(); render(); }
}
const snapData = d => Object.assign({id:d.id}, d.data());

async function init(){
  try{ const sk=localStorage.getItem(SKEY); if(sk) applySkin(sk); }catch(e){}
  let an=null; try{ an=localStorage.getItem(AKEY); }catch(e){}
  applyAnim(an!=null?an==='1':true);
  render();
  let db=null,user=null;
  try{ db=await claude.use('db'); }catch(e){}
  try{ user=await claude.use('user'); }catch(e){}
  S.user=user;
  if(user){
    try{ S.me=await user.id(); }catch(e){}
    try{ if(user.can('data.write')===false) S.readonly=true; }catch(e){}
  }
  if(!db){ S.local=true; loadLocal(); sortAll(); render(); return; }
  S.db=db;
  if(S.me){ db.doc('data/users/'+S.me+'/prefs').get().then(s=>{ const k=s.exists&&s.data().skin; if(k&&k!==S.skin){ applySkin(k); try{ localStorage.setItem(SKEY,k); }catch(e){} }
    const an=s.exists?s.data().anim:undefined; if(typeof an==='boolean'&&an!==S.anim){ applyAnim(an); try{ localStorage.setItem(AKEY,an?'1':'0'); }catch(e){} } }).catch(()=>{}); }
  const timer=setTimeout(()=>{ if(!S.synced){ S.slow=true; render(); } },10000);
  const done=snap=>{ if(!snap.metadata.fromCache){ S.synced=true; S.slow=false; clearTimeout(timer); } };
  const onErr=e=>{ if(e&&e.code==='revoked'){ S.readonly=true; } S.slow=true; render(); };
  db.collection('events').orderBy('ts','desc').limit(1000).onSnapshot(snap=>{
    const was=S.synced;
    S.events=snap.docs.map(snapData); done(snap); resolveNames();
    if(was&&!snap.metadata.hasPendingWrites){
      snap.docChanges().forEach(c=>{
        if(c.type==='removed') return;
        const d=snapData(c.doc); if(!d.who||d.who===S.me||c.doc.metadata.hasPendingWrites) return;
        const f=evInfo(d); toast((S.names[d.who]||'Otro cuidador')+' registró: '+f.t+(f.s?' · '+f.s:''));
      });
    }
    render();
  },onErr);
  db.collection('growth').orderBy('ts','asc').limit(500).onSnapshot(snap=>{
    S.growth=snap.docs.map(snapData); done(snap); render();
  },onErr);
  db.doc('meta/profile').onSnapshot(s=>{
    S.profile=s.exists?s.data():{}; try{ if(S.profile.name) localStorage.setItem('diario-bebe-nombre',S.profile.name); }catch(e){} done(s); render();
  },onErr);
}
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(S.events.map(e=>e.who).filter(Boolean))].filter(i=>!S.asked.has(i));
  if(!ids.length) return;
  ids.forEach(i=>S.asked.add(i));
  try{
    const ps=await S.user.profiles(ids); let changed=false;
    ids.forEach(i=>{ const n=ps&&ps[i]&&ps[i].name; if(n){ S.names[i]=n; changed=true; } });
    if(changed) render();
  }catch(e){}
}
const whoName = e => e.who ? (e.who===S.me ? 'tú' : (S.names[e.who]||'')) : '';

function openBreast(){ return S.events.find(e=>e.type==='breast'&&!e.end); }

function evInfo(e){
  switch(e.type){
    case 'sleep': return {i:'moon',c:'sleep',t:e.end?'Durmió '+fmtDur(e.end-e.ts):'Durmiendo',s:e.end?hm(e.ts)+' a '+hm(e.end):'desde las '+hm(e.ts)};
    case 'breast': return {i:'heart',c:'feed',t:'Pecho '+(SIDE[e.side]||''),s:e.end?fmtDur(e.end-e.ts):'en curso'};
    case 'bottle': return {i:'bottle',c:'feed',t:(e.ml||0)+' ml',s:e.kind==='materna'?'Biberón con leche materna':'Biberón con fórmula'};
    case 'solid': return {i:'spoon',c:'feed',t:e.food||'Sólidos',s:'Sólidos'+(e.amount?' · '+AMT[e.amount]:'')};
    case 'diaper': return {i:'drop',c:'diaper',t:DIAP[e.kind]||'Pañal',s:'Pañal'};
    case 'med': return {i:'pill',c:'health',t:e.name||'Medicina',s:'Medicina'+(e.dose?' · '+e.dose:'')};
    case 'fever': return {i:'therm',c:'health',t:Number(e.temp).toFixed(1)+' °C',s:'Temperatura'+(e.temp>=38?' · fiebre':'')};
    case 'vaccine': return {i:'syringe',c:'health',t:e.name||'Vacuna',s:'Vacuna'};
  }
  return {i:'list',c:'grow',t:e.type,s:''};
}
function rowHTML(e){

  return '<div class="row c-'+f.c+'"><button class="rowmain" data-edit="'+esc(e.id)+'"><span class="dot">'+ic(f.i)+'</span><span class="tx"><div class="t">'+esc(f.t)+'</div><div class="s">'+esc(f.s)+'</div>'+(e.note?'<div class="nt">'+esc(e.note)+'</div>':'')+'</span><span class="r">'+time+(w?'<br>'+esc(w):'')+'</span></button>'+(e.type==='sleep'?'<button class="rowedit" data-flip="'+esc(e.id)+'" aria-label="Cambiar se durmió o se despertó">'+ic('swap')+'</button>':'')+editBtn('edit',e.id)+delBtn('delev',e.id)+'</div>';

async function addEvent(ev,msg){

/* ---------- acciones de un toque ---------- */
async function toggleSleep(){
  const o=openSleep();
  if(o){ const prev=Object.assign({},o); try{ await write('events',o.id,Object.assign({},o,{end:Date.now()})); toast('Se despertó a las '+hm(Date.now()),()=>write('events',prev.id,prev)); }catch(e){} }
  else addEvent({type:'sleep',ts:Date.now(),end:null},'Se durmió a las '+hm(Date.now()));
}
async function toggleBreast(side){
  const o=openBreast(), now=Date.now();
  if(o){
    const prev=Object.assign({},o);
    try{ await write('events',o.id,Object.assign({},o,{end:now})); }catch(e){ return; }
    if(o.side===side){ toast('Pecho '+SIDE[side]+': '+fmtDur(now-o.ts),()=>write('events',prev.id,prev)); return; }
    pushUndo('Fin de pecho '+SIDE[o.side],()=>write('events',prev.id,prev));
  }
  addEvent({type:'breast',side,ts:now,end:null},'Pecho '+SIDE[side]+' iniciado');
}

  const el=document.getElementById('f_'+id); return el?el.value.trim():'';

function num(id){ const v=val(id).replace(',','.'); if(v==='') return null; const n=Number(v); return isFinite(n)?n:null; }

function eventSheet(type,e){
  const edit=!!e, now=Date.now(), ts=e?e.ts:now;
  const T=n=>({t:'datetime-local',id:'ts',l:n||'Hora',v:toLocalInput(ts)});
  let title,fields,build;
  if(type==='bottle'){
    title='Biberón';
    fields=[{t:'seg',id:'kind',l:'Contenido',v:(e&&e.kind)||'formula',o:[['formula','Fórmula'],['materna','Leche materna']]},
      {t:'chips',id:'ml',o:[30,60,90,120,150,180,210]},{t:'number',id:'ml',l:'Cantidad (ml)',v:e?e.ml:'',ph:'ml'},T()];
    build=()=>{ const ml=num('ml'); if(!ml||ml<=0) return 'Escribe cuántos ml tomó.'; return {type,ts:fromLocalInput(val('ts')),kind:val('kind'),ml}; };
  } else if(type==='solid'){
    title='Sólidos';
    fields=[{t:'text',id:'food',l:'¿Qué comió?',v:e?e.food:'',ph:'Ej. papilla de manzana'},
      {t:'seg',id:'amount',l:'¿Cuánto comió?',v:(e&&e.amount)||'medio',o:[['poco','Poco'],['medio','Medio'],['mucho','Mucho']]},T()];
    build=()=>{ const food=val('food'); if(!food) return 'Escribe qué comió.'; return {type,ts:fromLocalInput(val('ts')),food,amount:val('amount')}; };
  } else if(type==='med'){
    title='Medicina';
    fields=[{t:'text',id:'name',l:'Medicina',v:e?e.name:'',ph:'Ej. paracetamol'},{t:'text',id:'dose',l:'Dosis',v:e?e.dose:'',ph:'Ej. 2,5 ml'},T()];
    build=()=>{ const name=val('name'); if(!name) return 'Escribe el nombre de la medicina.'; return {type,ts:fromLocalInput(val('ts')),name,dose:val('dose')}; };
  } else if(type==='fever'){
    title='Temperatura';
    fields=[{t:'number',id:'temp',l:'Temperatura (°C)',v:e?e.temp:'',ph:'36.8',step:'0.1'},T()];
    build=()=>{ const temp=num('temp'); if(!temp||temp<30||temp>45) return 'Escribe una temperatura entre 30 y 45 °C.'; return {type,ts:fromLocalInput(val('ts')),temp}; };
  } else if(type==='vaccine'){

/* ---------- cambio que faltó en medio (se durmió / se despertó) ---------- */
function askGap(cfg){
  return new Promise(res=>{
    if(cfg.to-cfg.from<2*60000){ res(Math.round(cfg.from+(cfg.to-cfg.from)/2)); return; }
    S.gap=Object.assign({v:Math.round((cfg.from+(cfg.to-cfg.from)/2)/60000)*60000,resolve:res},cfg);
    S.sheet={gap:true}; renderGap();
  });
}
function gapTexts(){
  const g=S.gap, a=g.v-g.from, b=g.to-g.v, p=(g.v-g.from)/(g.to-g.from)*100;
  const first=g.kind==='wake'?['sleep','Durmió '+fmtDur(a)]:['awake','Despierto '+fmtDur(a)];
  const second=g.kind==='wake'?['awake','Despierto '+fmtDur(b)]:['sleep','Durmió '+fmtDur(b)];
  return {p,first,second};
}
function renderGap(){
  const g=S.gap, mins=Math.round((g.to-g.from)/60000), val=Math.round((g.v-g.from)/60000), t=gapTexts();
  const what=g.kind==='wake'?'Se despertó':'Se durmió';
  const h='<h2>Falta «'+what+'»</h2><p class="kphint">'+esc(g.intro)+'</p>'
   +'<p class="kphint"><b>Mueve la barra</b> hasta la hora en que '+(g.kind==='wake'?'se despertó':'se durmió')+'.</p>'
   +'<div class="gapbig"><span id="gaptime">'+esc(hm(g.v))+'</span><small id="gapday">'+esc(dayLabel(g.v))+'</small></div>'
   +'<div class="gapseg"><span id="gapA" class="gs-'+t.first[0]+'" style="flex-grow:'+t.p.toFixed(2)+'">'+esc(t.first[1])+'</span><span id="gapB" class="gs-'+t.second[0]+'" style="flex-grow:'+(100-t.p).toFixed(2)+'">'+esc(t.second[1])+'</span></div>'
   +'<input type="range" id="gaprange" min="0" max="'+mins+'" step="1" value="'+val+'" aria-label="Hora en que '+(g.kind==='wake'?'se despertó':'se durmió')+'" style="--p:'+t.p.toFixed(2)+'%">'
   +'<div class="gapends"><span><b>'+esc(g.fromLabel)+'</b>'+esc(hm(g.from))+'</span><span style="text-align:right"><b>'+esc(g.toLabel)+'</b>'+esc(hm(g.to))+'</span></div>'
   +'<div class="gapfine" role="group" aria-label="Ajuste fino">'+[-15,-5,-1,1,5,15].map(m=>'<button type="button" data-gapadj="'+m+'">'+(m>0?'+':'−')+Math.abs(m)+' min</button>').join('')+'</div>'
   +'<div class="acts"><button type="button" class="primary" data-gapsave="1">'+esc(g.saveLabel||'Guardar')+'</button><button type="button" class="ghost" data-close="1">Cancelar</button></div>';
  document.getElementById('sheetroot').innerHTML='<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="Falta '+what+'">'+h+'</div></div>';
  document.getElementById('gaprange').addEventListener('input',e=>{ S.gap.v=S.gap.from+Number(e.target.value)*60000; gapUpdate(); });
}
function gapUpdate(){
  const g=S.gap, t=gapTexts(), r=document.getElementById('gaprange'); if(!r) return;
  document.getElementById('gaptime').textContent=hm(g.v);
  document.getElementById('gapday').textContent=dayLabel(g.v);
  const A=document.getElementById('gapA'), B=document.getElementById('gapB');
  A.style.flexGrow=t.p.toFixed(2); B.style.flexGrow=(100-t.p).toFixed(2); A.textContent=t.first[1]; B.textContent=t.second[1];
  r.style.setProperty('--p',t.p.toFixed(2)+'%'); r.value=Math.round((g.v-g.from)/60000);
}
function gapSave(){ const g=S.gap; if(!g) return; const r=g.resolve, v=g.v; S.gap=null; S.sheet=null; document.getElementById('sheetroot').innerHTML=''; r(v); }

/* Botón «Cambiar a…» junto al botón de sueño (lo que se va a registrar ahora) */
async function sleepAlt(){
  const now=Date.now(), o=openSleep();
  if(o){
    const v=await askGap({kind:'wake',from:o.ts,to:now,fromLabel:'Se durmió',toLabel:'Ahora',
      intro:'Estaba dormido desde las '+hm(o.ts)+' y vas a registrar «Se durmió» otra vez. Falta anotar cuándo se despertó en medio.'});
    if(v==null) return;
    const prev=JSON.parse(JSON.stringify(o)), nu={id:newId(),type:'sleep',ts:now,end:null}; if(S.me) nu.who=S.me;
    try{ await write('events',o.id,Object.assign({},o,{end:v})); await write('events',nu.id,nu); }catch(e){ return; }
    toast('Se despertó a las '+hm(v)+' y se durmió otra vez a las '+hm(now),async()=>{ await remove('events',nu.id); await write('events',prev.id,prev); });
  } else {
    const last=S.events.find(e=>e.type==='sleep'&&e.end), from=last?last.end:now-12*36e5;
    const v=await askGap({kind:'sleep',from,to:now,fromLabel:last?'Se despertó':'12 h atrás',toLabel:'Ahora',
      intro:last?'Se despertó a las '+hm(last.end)+' y vas a registrar «Se despertó» otra vez. Falta anotar cuándo se durmió en medio.':'Vas a registrar «Se despertó», pero no hay un «Se durmió» antes. Elige cuándo se durmió (hasta 12 horas atrás).'});
    if(v==null) return;
    const nu={id:newId(),type:'sleep',ts:v,end:now}; if(S.me) nu.who=S.me;
    try{ await write('events',nu.id,nu); }catch(e){ return; }
    toast('Durmió de '+hm(v)+' a '+hm(now),()=>remove('events',nu.id));
  }
}

/* En el historial: cambiar un «Se durmió» por «Se despertó» o al revés */
function sleepPoints(){
  const pts=[]; S.events.filter(e=>e.type==='sleep').forEach(s=>{ pts.push({t:s.ts,k:'d',id:s.id}); if(s.end) pts.push({t:s.end,k:'w',id:s.id}); });
  return pts.sort((a,b)=>a.t-b.t||(a.k==='d'?1:-1));
}
const KW={d:'Se durmió',w:'Se despertó'};
function flipChooser(id){
  const s=S.events.find(e=>e.id===id); if(!s) return;
  const opt=(k,t)=>'<button type="button" class="flipopt" data-flipdo="'+esc(id)+'|'+k+'"><span class="fo-a">'+KW[k]+' · '+esc(hm(t))+'</span><span class="fo-arrow">'+ic('swap')+'</span><span class="fo-b">'+KW[k==='d'?'w':'d']+'</span></button>';
  S.sheet={flip:true};
  document.getElementById('sheetroot').innerHTML='<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="Cambiar sueño"><h2>Cambiar este sueño</h2>'
    +'<p class="kphint">'+esc(dayLabel(s.ts))+'. Elige qué momento estaba mal anotado. Si al cambiarlo quedan dos iguales seguidos, te pediré el que falta en medio.</p>'
    +opt('d',s.ts)+(s.end?opt('w',s.end):'')
    +'<div class="acts"><button type="button" class="ghost" data-close="1">Cancelar</button></div></div></div>';
}
async function flipPoint(id,k){
  const pts=sleepPoints(), i=pts.findIndex(p=>p.id===id&&p.k===k); if(i<0) return;
  const p=pts[i], prev=pts[i-1], next=pts[i+1], nk=k==='d'?'w':'d', added=[];
  const miss=x=>x==='w'?'d':'w';
  if(prev?prev.k===nk:nk==='w'){
    const mk=miss(nk), from=prev?prev.t:p.t-12*36e5;
    const v=await askGap({kind:mk==='w'?'wake':'sleep',from,to:p.t,fromLabel:prev?KW[prev.k]:'12 h antes',toLabel:KW[nk]+' (cambiado)',
      intro:prev?'Al cambiarlo quedan dos «'+KW[nk]+'» seguidos ('+hm(prev.t)+' y '+hm(p.t)+'). Falta anotar «'+KW[mk]+'» en medio.':'Antes de este «Se despertó» no hay un «Se durmió». Elige cuándo se durmió.',saveLabel:next&&next.k===nk?'Siguiente':'Guardar'});
    if(v==null) return; added.push({t:v,k:mk});
  }
  if(next&&next.k===nk){
    const mk=miss(nk);
    const v=await askGap({kind:mk==='w'?'wake':'sleep',from:p.t,to:next.t,fromLabel:KW[nk]+' (cambiado)',toLabel:KW[next.k],
      intro:'Al cambiarlo quedan dos «'+KW[nk]+'» seguidos ('+hm(p.t)+' y '+hm(next.t)+'). Falta anotar «'+KW[mk]+'» en medio.'});
    if(v==null) return; added.push({t:v,k:mk});
  }
  const ids=new Set([p.id,prev&&prev.id,next&&next.id].filter(Boolean));
  const set=pts.filter(q=>ids.has(q.id)).map(q=>({t:q.t,k:q===p?nk:q.k})).concat(added).sort((a,b)=>a.t-b.t||(a.k==='d'?1:-1));
  const per=[]; let cur=null;
  set.forEach(q=>{ if(q.k==='d'){ if(cur==null) cur=q.t; } else if(cur!=null){ per.push({ts:cur,end:q.t}); cur=null; } });
  if(cur!=null) per.push({ts:cur,end:null});
  const olds=[...ids].map(x=>JSON.parse(JSON.stringify(S.events.find(e=>e.id===x)))).filter(Boolean);
  const news=per.map(pp=>{ const o={id:newId(),type:'sleep',ts:pp.ts,end:pp.end}; if(S.me) o.who=S.me; return o; });
  try{ for(const o of olds) await remove('events',o.id); for(const n of news) await write('events',n.id,n); }
  catch(e){ toast('No se pudo cambiar. Intenta de nuevo.'); return; }
  toast('Sueño corregido: '+news.map(n=>hm(n.ts)+'–'+(n.end?hm(n.end):'ahora')).join(', '),async()=>{ for(const n of news) await remove('events',n.id); for(const o of olds) await write('events',o.id,o); });
}

/* ---------- borrar datos: todo o desde un momento hacia atrás ---------- */
const pad2=n=>String(n).padStart(2,'0');
const RZ_F=[['d','Día',2],['m','Mes',2],['y','Año',4],['h','Hora',2],['mi','Min',2]];
const RZ_A=[['d','Días',3],['h','Horas',2],['m','Minutos',3]];
function openReset(){
  const n=new Date();
  S.rz={mode:'before',how:'atras',f:{d:pad2(n.getDate()),m:pad2(n.getMonth()+1),y:String(n.getFullYear()),h:pad2(n.getHours()),mi:pad2(n.getMinutes())},
        a:{d:'',h:'',m:''},act:'h',fresh:true,ev:true,gr:true,all:false};
  S.sheet={rz:true}; renderRZ();
}
function rzInstant(){
  const r=S.rz; if(r.mode==='all') return Infinity;
  if(r.how==='fecha'){
    const f=r.f, d=new Date(+f.y,+f.m-1,+f.d,+f.h,+f.mi);
    if(f.y.length!==4||!f.d||!f.m||f.h===''||f.mi===''||isNaN(d)||d.getDate()!==+f.d||d.getMonth()!==+f.m-1||+f.h>23||+f.mi>59) return null;
    return d.getTime();
  }
  const a=r.a; return Date.now()-(((+a.d||0)*24+(+a.h||0))*60+(+a.m||0))*60000;
}
function rzTargets(){
  const t=rzInstant(); if(t==null) return null;
  const ev=S.rz.ev?S.events.filter(e=>e.ts<=t).map(r=>({c:'events',r})):[];
  const gr=S.rz.gr?S.growth.filter(g=>g.ts<=t).map(r=>({c:'growth',r})):[];
  return ev.concat(gr).sort((a,b)=>b.r.ts-a.r.ts);
}
function rzRow(x){
  const f=x.c==='growth'?{i:'ruler',c:'grow',t:'Peso y talla',s:new Date(x.r.ts).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})}:evInfo(x.r);
  return '<div class="row c-'+f.c+'"><div class="rowmain" style="cursor:default"><span class="dot">'+ic(f.i)+'</span><span class="tx"><div class="t">'+esc(f.t)+'</div><div class="s">'+esc(x.c==='growth'?f.s:f.s+' · '+dayLabel(x.r.ts)+', '+hm(x.r.ts))+'</div></span></div>'
    +'<button class="rowdel" data-'+(x.c==='growth'?'delg':'delev')+'="'+esc(x.r.id)+'" aria-label="Borrar este registro">'+ic('trash')+'</button></div>';
}
function renderRZ(){
  if(!S.sheet||!S.sheet.rz) return;
  const r=S.rz, inst=rzInstant(), list=rzTargets();
  const seg=(attr,cur,opts)=>'<div class="seg" role="group">'+opts.map(([v,l])=>'<button type="button" data-'+attr+'="'+v+'" class="'+(v===cur?'on':'')+'" aria-pressed="'+(v===cur)+'">'+l+'</button>').join('')+'</div>';
  let h='<h2>Borrar datos</h2>'
   +'<div class="fld"><label>¿Qué quieres borrar?</label>'+seg('rzmode',r.mode,[['before','Desde un momento hacia atrás'],['all','Todo']])+'</div>';
  if(r.mode==='before'){
    const fs=r.how==='fecha'?RZ_F:RZ_A, obj=r.how==='fecha'?r.f:r.a;
    h+='<div class="fld"><label>Elige el momento</label>'+seg('rzhow',r.how,[['atras','Hace cierto tiempo'],['fecha','Día y hora exactos']])+'</div>'
     +'<div class="kpd">'+fs.map(([id,l])=>'<button type="button" class="kf'+(r.act===id?' on':'')+'" data-kf="'+id+'"><small>'+l+'</small><b>'+(obj[id]||'0')+'</b></button>').join('')+'</div>';
    let hint;
    if(inst==null) hint='Revisa la fecha: ese día u hora no existe.';
    else if(inst>=Date.now()-30000) hint='Desde ahora hacia atrás: se borraría todo lo registrado hasta este momento.';
    else hint='Se borra todo lo registrado el '+new Date(inst).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' a las '+hm(inst)+' y antes. Lo más reciente se conserva.';
    h+='<p class="kphint'+(inst==null?' bad':'')+'">'+esc(hint)+'</p>'
     +'<div class="kp" role="group" aria-label="Teclado numérico">'+['1','2','3','4','5','6','7','8','9'].map(n=>'<button type="button" data-kp="'+n+'">'+n+'</button>').join('')
     +'<button type="button" data-kp="back" aria-label="Borrar dígito">⌫</button><button type="button" data-kp="0">0</button><button type="button" data-kp="next" class="kpnext">Siguiente</button></div>';
  } else {
    h+='<p class="kphint bad">Se borrará todo lo marcado abajo, en todos los celulares. Los datos del bebé (nombre y fecha de nacimiento) se conservan.</p>';
  }
  h+='<div class="fld"><label>Incluir</label><div class="seg">'
    +'<button type="button" data-rzt="ev" class="'+(r.ev?'on':'')+'" aria-pressed="'+r.ev+'">'+(r.ev?'✓ ':'')+'Registros del día a día</button>'
    +'<button type="button" data-rzt="gr" class="'+(r.gr?'on':'')+'" aria-pressed="'+r.gr+'">'+(r.gr?'✓ ':'')+'Medidas de crecimiento</button></div></div>';
  const n=list?list.length:0;
  h+='<div class="rzsum"><b>'+(list==null?'—':n===0?'No hay nada que borrar con esta selección':n+(n===1?' registro':' registros')+' se borrarían')+'</b>'+(n?'<span>Puedes quitarlos uno por uno con el bote de basura, o todos juntos con el botón rojo.</span>':'')+'</div>';
  if(n){ const show=r.all?list:list.slice(0,25);
    h+='<div class="list">'+show.map(rzRow).join('')+'</div>'+(n>show.length?'<button type="button" class="ghost" data-rzall="1">Ver los '+n+'</button>':''); }
  h+='<div class="acts"><button type="button" class="dangerfill" data-rzgo="1"'+(n?'':' disabled')+'>'+(n?'Borrar '+(n===1?'este registro':'estos '+n+' registros'):'Nada para borrar')+'</button><button type="button" class="ghost" data-close="1">Cerrar</button></div>';

function rzKey(k){
  const r=S.rz, fs=r.how==='fecha'?RZ_F:RZ_A, obj=r.how==='fecha'?r.f:r.a;
  const i=fs.findIndex(x=>x[0]===r.act), id=fs[i][0], max=fs[i][2];
  if(k==='back'){ obj[id]=r.fresh?'':obj[id].slice(0,-1); r.fresh=false; }
  else if(k==='next'){ r.act=fs[(i+1)%fs.length][0]; r.fresh=true; }
  else { obj[id]=((r.fresh?'':obj[id])+k).slice(-max); r.fresh=false; if(obj[id].length>=max&&i<fs.length-1){ r.act=fs[i+1][0]; r.fresh=true; } }
  renderRZ();
}
async function bulkDelete(list,label){
  if(S.readonly){ toast('Solo tienes permiso de lectura.'); return; }
  const copies=list.map(x=>{ const d=JSON.parse(JSON.stringify(x.r)); delete d.id; return {c:x.c,id:x.r.id,d}; });
  const run=async fn=>{ for(let i=0;i<copies.length;i+=8) await Promise.all(copies.slice(i,i+8).map(fn)); };
  try{
    if(S.db) await run(x=>S.db.collection(x.c).doc(x.id).delete());
    else { const ids=new Set(copies.map(x=>x.c+'/'+x.id)); S.events=S.events.filter(e=>!ids.has('events/'+e.id)); S.growth=S.growth.filter(g=>!ids.has('growth/'+g.id)); saveLocal(); }
  }catch(e){ toast('No se pudo borrar todo. Revisa la conexión e intenta de nuevo.'); render(); return; }
  toast(label,async()=>{
    if(S.db) await run(x=>S.db.collection(x.c).doc(x.id).set(x.d));
    else { copies.forEach(x=>(x.c==='events'?S.events:S.growth).push(Object.assign({id:x.id},x.d))); sortAll(); saveLocal(); }
    render();
  });
  render();
}

function dayStats(ds){
  const de=ds+DAY, r={sleepMs:0,sleeps:0,breast:0,breastMs:0,bottle:0,ml:0,solid:0,diapers:0,pipi:0,popo:0,meds:0,fev:null};
  const now=Date.now();
  for(const e of S.events){
    if(e.type==='sleep'){ const o=Math.min(e.end||now,de)-Math.max(e.ts,ds); if(o>0){ r.sleepMs+=o; r.sleeps++; } continue; }
    if(e.ts<ds||e.ts>=de) continue;
    if(e.type==='breast'){ r.breast++; r.breastMs+=(e.end||now)-e.ts; }
    else if(e.type==='bottle'){ r.bottle++; r.ml+=e.ml||0; }
    else if(e.type==='solid') r.solid++;
    else if(e.type==='diaper'){ r.diapers++; if(e.kind!=='popo') r.pipi++; if(e.kind!=='pipi') r.popo++; }
    else if(e.type==='med'||e.type==='vaccine') r.meds++;
    else if(e.type==='fever'){ r.fev=r.fev==null?e.temp:Math.max(r.fev,e.temp); }
  }
  r.feeds=r.breast+r.bottle+r.solid; return r;
}

function lmsAt(sex,m,age){

const zOf=(x,[L,M,Sd])=>Math.abs(L)<1e-6?Math.log(x/M)/Sd:(Math.pow(x/M,L)-1)/(L*Sd);

function phi(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function pctText(z){ const p=phi(z)*100; if(p<1) return 'menos de 1'; if(p>99) return 'más de 99'; return String(Math.round(p)); }

function growthChart(m){
  const M=METRICS[m], b=birthTs(), sex=S.profile.sex;
  const rows=S.growth.filter(g=>g[m]!=null);
  if(!rows.length) return '<div class="empty">Aún no hay medidas de '+M.label.toLowerCase()+'.</div>';
  const base=b!=null?b:rows[0].ts;
  const pts=rows.map(g=>({x:Math.max(0,(g.ts-base)/MONTH),y:g[m]}));
  const hasRef=b!=null&&LMS[sex];
  const nowX=b!=null?(Date.now()-b)/MONTH:0;
  const dataMax=Math.max(...pts.map(p=>p.x),nowX);
  const xmax=Math.max(6,Math.min(Math.max(24,Math.ceil(dataMax)),Math.ceil(dataMax+2)));
  const bands=[];
  if(hasRef){ for(let x=0;x<=Math.min(24,xmax)+1e-9;x+=0.25){ const r=lmsAt(sex,m,x); bands.push({x,v:BANDS.map(z=>valAtZ(z[0],r))}); } }
  const ys=pts.map(p=>p.y); bands.forEach(bd=>ys.push(bd.v[0],bd.v[4]));
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const step=niceStep(hi-lo); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const W=340,H=250,L=36,R=34,T=12,B=32;
  const X=x=>L+x/xmax*(W-L-R), Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
  const P=(arr,k)=>arr.map(bd=>X(bd.x).toFixed(1)+','+Y(bd.v[k]).toFixed(1));
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+nf(v,2)+'</text>';
  const xs=xmax<=6?1:(xmax<=12?2:3);
  for(let x=0;x<=xmax;x+=xs) g+='<text x="'+X(x)+'" y="'+(H-14)+'" text-anchor="middle">'+x+'</text>';
  g+='<text x="'+((L+W-R)/2)+'" y="'+(H-1)+'" text-anchor="middle">'+(b!=null?'edad en meses':'meses desde la primera medida')+'</text>';
  if(bands.length>1){
    g+='<polygon points="'+P(bands,0).concat(P(bands,4).reverse()).join(' ')+'" fill="var(--grow)" fill-opacity=".10"/>';
    g+='<polygon points="'+P(bands,1).concat(P(bands,3).reverse()).join(' ')+'" fill="var(--grow)" fill-opacity=".13"/>';
    [0,4].forEach(k=>{ g+='<polyline fill="none" stroke="var(--grow)" stroke-opacity=".45" stroke-width="1" points="'+P(bands,k).join(' ')+'"/>'; });
    g+='<polyline fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" points="'+P(bands,2).join(' ')+'"/>';
    const lb=bands[bands.length-1];
    [[4,'P97'],[2,'P50'],[0,'P3']].forEach(([k,n])=>{ g+='<text x="'+(X(lb.x)+4)+'" y="'+(Y(lb.v[k])+3.5)+'">'+n+'</text>'; });
  }
  if(b!=null&&nowX<=xmax) g+='<line x1="'+X(nowX)+'" x2="'+X(nowX)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--accent)" stroke-opacity=".5" stroke-dasharray="2 3"/><text x="'+X(nowX)+'" y="'+(T+9)+'" text-anchor="middle" style="fill:var(--accent)">hoy</text>';

  const lp=pts[pts.length-1], anchor=X(lp.x)>W-90?'end':(X(lp.x)<L+40?'start':'middle');
  g+='<text x="'+X(lp.x).toFixed(1)+'" y="'+(Y(lp.y)-11).toFixed(1)+'" text-anchor="'+anchor+'" style="fill:var(--ink);font-weight:700;font-size:12px">'+nf(lp.y,2)+' '+M.unit+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Curva de '+M.label.toLowerCase()+' con percentiles de la OMS">'+g+'</svg>'
   +'<div class="legend"><span><i></i>'+esc(S.profile.name||'Tu bebé')+'</span>'+(bands.length?'<span><i class="d"></i>Mediana (P50)</span><span><i class="band"></i>Rango P3 a P97</span>':'')+'</div>';
}
function growthInsights(m){
  const M=METRICS[m], sex=S.profile.sex, b=birthTs(), out=[];
  const rows=S.growth.filter(g=>g[m]!=null);
  if(!rows.length) return out;
  if(b==null||!LMS[sex]){ out.push({l:'info',t:'Agrega la fecha de nacimiento y si es niño o niña para comparar con la OMS.'}); }
  const last=rows[rows.length-1], ageL=ageAt(last.ts);
  const unitTxt=v=>nf(v,M.dec)+' '+M.unit;
  let zL=null;
  if(b!=null&&LMS[sex]&&ageL!=null&&ageL<=24){
    const r=lmsAt(sex,m,ageL); zL=zOf(last[m],r); const p=phi(zL)*100;
    out.push({l:(p>=3&&p<=97)?'ok':'warn',
      t:M.label+' en el percentil '+pctText(zL)+' para su edad',
      d:(p>=3&&p<=97?'Dentro del rango habitual (P3 a P97). ':'Fuera del rango habitual (P3 a P97): coméntalo con el pediatra. ')+'La mediana de la OMS a esa edad es '+unitTxt(r[1])+'; su medida fue '+unitTxt(last[m])+'.'});
  }
  if(rows.length>=2){
    const prev=rows[rows.length-2], days=(last.ts-prev.ts)/DAY;
    if(days>=3){
      const diff=last[m]-prev[m];
      let exp=null;
      if(b!=null&&LMS[sex]){ const a1=ageAt(prev.ts), a2=ageL; if(a1!=null&&a2<=24&&a1>=0){ exp=(lmsAt(sex,m,a2)[1]-lmsAt(sex,m,a1)[1]); } }
      if(m==='kg'){
        const gpd=diff*1000/days, epd=exp!=null?exp*1000/days:null;
        out.push({l:diff<0?'warn':(epd!=null&&gpd<epd*0.6?'info':'ok'),
          t:(diff<0?'Bajó ':'Subió ')+nf(Math.abs(diff)*1000,0)+' g en '+Math.round(days)+' días ('+nf(gpd,0)+' g al día)',
          d:(epd!=null?'Lo que gana un bebé en la mediana de la OMS en ese mismo periodo: unos '+nf(epd,0)+' g al día. ':'')+(diff<0?'Una baja de peso merece consultarse con el pediatra.':'Lo que más importa es que siga su propia curva.')});
      } else {
        const pm=diff/days*30.4, em=exp!=null?exp/days*30.4:null;
        out.push({l:diff<0?'info':'ok',t:(diff<0?'Cambió ':'Creció ')+nf(diff,1)+' cm en '+Math.round(days)+' días ('+nf(pm,1)+' cm al mes)',
          d:(em!=null?'Referencia de la mediana OMS para ese periodo: '+nf(em,1)+' cm al mes. ':'')+(diff<0?'Puede ser una diferencia de medición; revisa el dato.':'')});
      }
      if(zL!=null){
        const a1=ageAt(prev.ts); const r1=lmsAt(sex,m,a1);
        if(r1){ const z1=zOf(prev[m],r1), dz=zL-z1;
          if(dz<=-0.67) out.push({l:'warn',t:'Pasó del percentil '+pctText(z1)+' al '+pctText(zL),d:'Bajar más de una línea de percentil entre controles es algo para revisar con el pediatra.'});
          else if(dz>=0.67) out.push({l:'info',t:'Subió del percentil '+pctText(z1)+' al '+pctText(zL),d:'Ganó posición en la curva entre los dos últimos controles.'});
          else out.push({l:'ok',t:'Sigue su curva',d:'Entre los dos últimos controles se mantuvo cerca del mismo percentil ('+pctText(z1)+' y '+pctText(zL)+').'});
        }
      }
    }
  }
  const ago=(Date.now()-last.ts)/DAY, aNow=ageAt(Date.now());
  if(ago>(aNow!=null&&aNow<6?35:65)) out.push({l:'info',t:'La última medida fue hace '+Math.round(ago)+' días',d:'Agrega la del próximo control para mantener la curva al día.'});
  return out;
}

/* ---------- análisis de actividad ---------- */
function hasRec(ds){ const de=ds+DAY, now=Date.now();
  return S.events.some(e=>(e.ts>=ds&&e.ts<de)||(e.type==='sleep'&&e.ts<de&&(e.end||now)>ds)); }
const median=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), k=s.length>>1; return s.length%2?s[k]:(s[k-1]+s[k])/2; };
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function fmtTOD(mins){ const d=new Date(); d.setHours(0,mins,0,0); return hm(d.getTime()); }
function sleepRef(a){ if(a==null) return null; if(a<4) return [14,17]; if(a<12) return [12,15]; if(a<=24) return [11,14]; return null; }
function wakeWindow(a){ if(a==null) return null;
  const t=[[1,35,60],[2,60,90],[4,75,120],[6,105,150],[8,120,180],[10,150,210],[14,180,240],[99,240,360]];
  const r=t.find(x=>a<x[0]); return [r[1],r[2]]; }
function feedInterval(from,to){
  const f=S.events.filter(e=>(e.type==='breast'||e.type==='bottle')&&e.ts>=from&&e.ts<to).map(e=>e.ts).sort((a,b)=>a-b);
  const iv=[]; for(let i=1;i<f.length;i++){ const d=f[i]-f[i-1]; if(d>=15*60000&&d<=8*36e5) iv.push(d); }
  return median(iv);
}
function analyze(){
  const t0=startOfDay(Date.now()), aNow=ageAt(Date.now());
  let cur=[],prev=[],partial=false;
  for(let i=1;i<=7;i++){ const d=t0-i*DAY; if(hasRec(d)) cur.push(d); }
  for(let i=8;i<=14;i++){ const d=t0-i*DAY; if(hasRec(d)) prev.push(d); }
  if(!cur.length&&hasRec(t0)){ cur=[t0]; partial=true; }
  const R={sleep:[],feed:[],diaper:[],health:[],days:cur.length,partial};
  if(!cur.length) return R;
  const from=Math.min(...cur), to=Math.max(...cur)+DAY;
  const ds=cur.map(dayStats), ps=prev.map(dayStats);
  const inR=e=>e.ts>=from&&e.ts<to;
  const nd=cur.length, dTxt=partial?'con lo registrado hoy (día incompleto)':'en '+nd+(nd===1?' día registrado':' días registrados');

  /* sueño */
  const avgSleep=mean(ds.map(d=>d.sleepMs));
  if(avgSleep>0){
    const ref=sleepRef(aNow), h=avgSleep/36e5;
    let l='info', d='';
    if(ref){ l=h>=ref[0]&&h<=ref[1]?'ok':'info'; d='Para su edad se recomiendan '+ref[0]+' a '+ref[1]+' h en 24 horas, contando siestas.'+(h<ref[0]?' Si faltó anotar algún sueño, el total se ve más bajo.':''); }
    if(ps.length){ const pa=mean(ps.map(x=>x.sleepMs)); if(pa>0){ const dm=Math.round((avgSleep-pa)/60000); if(Math.abs(dm)>=10) d+=' Frente a la semana anterior: '+(dm>0?'+':'−')+fmtDur(Math.abs(dm)*60000)+' por día.'; } }
    R.sleep.push({l,t:'Duerme en promedio '+fmtH(avgSleep)+' al día',d:d.trim()+' ('+dTxt+').'});
  }
  const sess=S.events.filter(e=>e.type==='sleep'&&e.end&&inR(e));
  if(sess.length){
    const lg=sess.reduce((a,b)=>(b.end-b.ts)>(a.end-a.ts)?b:a);
    R.sleep.push({l:'info',t:'Su sueño más largo seguido: '+fmtDur(lg.end-lg.ts),d:dayLabel(lg.ts)+', desde las '+hm(lg.ts)+'. Promedio de cada periodo de sueño: '+fmtDur(mean(sess.map(s=>s.end-s.ts)))+'.'});
    let night=0,tot=0;
    sess.forEach(s=>{ for(let t=s.ts;t<s.end;t+=60000){ const h=new Date(t).getHours(); tot++; if(h>=19||h<7) night++; } });
    if(tot) R.sleep.push({l:'info',t:Math.round(night/tot*100)+' % de su sueño fue de noche',d:'Se cuenta como noche de 7 pm a 7 am. '+(aNow!=null&&aNow<3?'En los primeros meses es normal que el sueño se reparta entre día y noche.':'Con los meses, el sueño tiende a concentrarse en la noche.')});
    const bed=sess.filter(s=>{ const h=new Date(s.ts).getHours(); return h>=18&&(s.end-s.ts)>=2*36e5; }).map(s=>{ const d=new Date(s.ts); return d.getHours()*60+d.getMinutes(); });
    if(bed.length>=2) R.sleep.push({l:'info',t:'Suele dormirse de noche cerca de las '+fmtTOD(Math.round(mean(bed))),d:'Calculado con '+bed.length+' noches. Una rutina con hora parecida cada día ayuda a regular el sueño.'});
  }

  /* comida */
  const avgFeeds=mean(ds.map(d=>d.breast+d.bottle));
  const iv=feedInterval(from,to);
  if(avgFeeds>0){
    const brAny=ds.some(d=>d.breast>0);
    let l='info', d=iv?'Tiempo típico entre tomas: '+fmtDur(iv)+'.':'';
    if(brAny&&aNow!=null&&aNow<3){ l=avgFeeds>=8&&avgFeeds<=12?'ok':'info'; d+=' Con pecho, en los primeros meses lo habitual son 8 a 12 tomas al día.'; }
    R.feed.push({l,t:nf(avgFeeds)+' tomas al día en promedio (pecho y biberón)',d:d.trim()});
  }
  const br=S.events.filter(e=>e.type==='breast'&&e.end&&inR(e));
  if(br.length){
    const mins=s=>br.filter(e=>e.side===s).reduce((a,e)=>a+(e.end-e.ts),0), li=mins('izq'), de=mins('der'), tot=li+de;
    const pl=tot?Math.round(li/tot*100):50;
    const lastB=S.events.find(e=>e.type==='breast');
    R.feed.push({l:Math.abs(pl-50)>15?'info':'ok',t:'Pecho: '+fmtDur(mean(br.map(e=>e.end-e.ts)))+' por toma en promedio',
      d:'Tiempo por lado: izquierdo '+pl+' %, derecho '+(100-pl)+' %. '+(Math.abs(pl-50)>15?'Conviene alternar más los lados. ':'Los lados están equilibrados. ')+(lastB?'La última toma fue del lado '+SIDE[lastB.side]+'.':'')});
  }
  const avgMl=mean(ds.map(d=>d.ml));
  if(avgMl>0){
    const bt=S.events.filter(e=>e.type==='bottle'&&inR(e));
    const mat=bt.filter(e=>e.kind==='materna').reduce((a,e)=>a+(e.ml||0),0), all=bt.reduce((a,e)=>a+(e.ml||0),0);
    let d='Promedio por biberón: '+nf(mean(bt.map(e=>e.ml||0)),0)+' ml. '+(all?Math.round(mat/all*100)+' % leche materna, '+(100-Math.round(mat/all*100))+' % fórmula.':'');
    if(ps.length){ const pm=mean(ps.map(x=>x.ml)); if(pm>0){ const dd=avgMl-pm; if(Math.abs(dd)>=20) d+=' Frente a la semana anterior: '+(dd>0?'+':'−')+nf(Math.abs(dd),0)+' ml por día.'; } }
    const lastW=[...S.growth].reverse().find(g=>g.kg!=null);
    if(!br.length&&lastW&&aNow!=null&&aNow<6) d+=' Referencia general solo con biberón: unos '+nf(Math.min(950,lastW.kg*150),0)+' ml al día (150 ml por kg, máximo cerca de 950 ml). Tu pediatra puede darte la cifra exacta.';
    R.feed.push({l:'info',t:'Biberón: '+nf(avgMl,0)+' ml al día en promedio',d:d.trim()});
  }
  const sol=S.events.filter(e=>e.type==='solid'&&e.ts>=Date.now()-14*DAY);
  if(sol.length){
    const foods=[...new Set(sol.map(e=>(e.food||'').trim().toLowerCase()).filter(Boolean))];
    R.feed.push({l:aNow!=null&&aNow<5.5?'info':'ok',t:sol.length+(sol.length===1?' comida sólida':' comidas sólidas')+' en 14 días',
      d:(foods.length?'Alimentos: '+foods.slice(0,12).join(', ')+'. ':'')+(aNow!=null&&aNow<5.5?'La OMS recomienda empezar los sólidos alrededor de los 6 meses; confírmalo con el pediatra.':'Ofrecer un alimento nuevo a la vez ayuda a notar si alguno le cae mal.')});
  }

  /* pañales */
  const avgD=mean(ds.map(d=>d.diapers));
  if(avgD>0){
    const wet=mean(ds.map(d=>d.pipi)), dirty=mean(ds.map(d=>d.popo));
    const ok=aNow==null||aNow<0.25||wet>=6;
    R.diaper.push({l:ok?'ok':'warn',t:nf(avgD)+' pañales al día en promedio',
      d:nf(wet)+' con pipí y '+nf(dirty)+' con popó por día. '+(ok?'Seis o más pañales mojados al día suele indicar que come lo suficiente.':'Lo habitual son 6 o más pañales mojados al día. Si no es por falta de registros, coméntalo con el pediatra.')});
  }
  const lastPoo=S.events.find(e=>e.type==='diaper'&&e.kind!=='pipi');
  if(lastPoo) R.diaper.push({l:'info',t:'Último popó hace '+fmtDur(Date.now()-lastPoo.ts),d:'Con lactancia materna puede pasar varios días sin popó y ser normal, si está tranquilo y come bien.'});

  /* salud */
  const fev=S.events.filter(e=>e.type==='fever'&&e.ts>=Date.now()-7*DAY);
  if(fev.length){
    const mx=fev.reduce((a,b)=>b.temp>a.temp?b:a), recent=fev.filter(e=>e.ts>=Date.now()-48*36e5&&e.temp>=38);
    let l='ok',d='Máxima: '+nf(mx.temp)+' °C ('+dayLabel(mx.ts)+', '+hm(mx.ts)+').';
    if(recent.length){ l='warn'; d+=aNow!=null&&aNow<3?' En bebés menores de 3 meses, 38 °C o más es motivo para consultar al médico de inmediato.':' Hubo fiebre (38 °C o más) en las últimas 48 horas. Consulta si dura más de 2 o 3 días, si está muy decaído o si te preocupa.'; }
    R.health.push({l,t:fev.length+(fev.length===1?' toma de temperatura':' tomas de temperatura')+' en 7 días',d});
  }
  const meds=S.events.filter(e=>e.type==='med'&&e.ts>=Date.now()-7*DAY);
  if(meds.length){
    const by={}; meds.forEach(e=>{ const k=(e.name||'Medicina').trim(); (by[k]=by[k]||[]).push(e); });
    Object.keys(by).forEach(k=>{ const a=by[k], last=a[0]; R.health.push({l:'info',t:k+': '+a.length+(a.length===1?' dosis':' dosis')+' en 7 días',d:'Última: '+dayLabel(last.ts)+', '+hm(last.ts)+(last.dose?' ('+last.dose+')':'')+'. Sigue siempre la indicación del pediatra.'}); });
  }
  const vac=S.events.filter(e=>e.type==='vaccine');
  if(vac.length) R.health.push({l:'info',t:vac.length+(vac.length===1?' vacuna registrada':' vacunas registradas'),d:'Última: '+(vac[0].name||'vacuna')+', '+new Date(vac[0].ts).toLocaleDateString('es',{day:'numeric',month:'long'})+'. Revisa el carné para la próxima dosis.'});
  return R;
}
function homeInsights(){
  const out=[], now=Date.now(), aNow=ageAt(now);
  const fev=S.events.find(e=>e.type==='fever'&&e.temp>=38&&e.ts>=now-48*36e5);
  if(fev) out.push({l:'warn',t:'Fiebre de '+nf(fev.temp)+' °C '+dayLabel(fev.ts).toLowerCase()+' a las '+hm(fev.ts),d:aNow!=null&&aNow<3?'En menores de 3 meses, 38 °C o más es motivo para consultar al médico de inmediato.':'Vigila cómo sigue y consulta si te preocupa.'});
  const os=openSleep();
  if(!os){
    const lastEnd=S.events.find(e=>e.type==='sleep'&&e.end), ww=wakeWindow(aNow);
    if(lastEnd&&ww){ const m=(now-lastEnd.end)/60000;
      out.push({l:m>ww[1]?'warn':'info',t:'Lleva despierto '+fmtDur(now-lastEnd.end),d:'A su edad, el tiempo despierto entre sueños suele ser de '+fmtDur(ww[0]*60000)+' a '+fmtDur(ww[1]*60000)+'. '+(m>ww[1]?'Puede estar cansado: busca señales de sueño.':(m>=ww[0]?'Pronto puede tener sueño.':''))}); }
  }
  const iv=feedInterval(now-7*DAY,now), lf=S.events.find(e=>e.type==='breast'||e.type==='bottle');
  if(iv&&lf){ const next=lf.ts+iv; out.push({l:next<now?'warn':'info',t:next<now?'Ya pasó su intervalo habitual entre tomas':'Próxima toma cerca de las '+hm(next),d:'Suele comer cada '+fmtDur(iv)+'; la última toma empezó a las '+hm(lf.ts)+'.'}); }
  const lb=S.events.find(e=>e.type==='breast');
  if(lb&&!openBreast()) out.push({l:'info',t:'Siguiente pecho: '+(lb.side==='izq'?'derecho':'izquierdo'),d:'La última toma fue del lado '+SIDE[lb.side]+', a las '+hm(lb.ts)+'.'});
  return out;
}

function aiPayload(){

    days.push({fecha:new Date(d).toISOString().slice(0,10),horas_sueno:sleepH(s.sleepMs),periodos_sueno:s.sleeps,tomas_pecho:s.breast,min_pecho:Math.round(s.breastMs/60000),biberones:s.bottle,ml_biberon:s.ml,solidos:s.solid,panales:s.diapers,pipi:s.pipi,popo:s.popo,temp_max:s.fev,medicinas_vacunas:s.meds,dia_incompleto:d===t0}); }
  const sex=S.profile.sex, growth=S.growth.map(g=>{ const a=ageAt(g.ts), o={fecha:new Date(g.ts).toISOString().slice(0,10),edad_meses:a!=null?Math.round(a*10)/10:null};
    ['kg','cm','head'].forEach(m=>{ if(g[m]!=null){ o[m]=g[m]; const r=a!=null?lmsAt(sex,m,a):null; if(r) o['percentil_'+m]=pctText(zOf(g[m],r)); } }); return o; });
  const A=analyze(), hallazgos=[].concat(A.sleep,A.feed,A.diaper,A.health,...['kg','cm','head'].map(growthInsights)).map(x=>x.t+(x.d?' — '+x.d:''));

}
async function runAI(){

function md(t){
  let h=esc(t).split('\n').map(l=>{ if(/^#{1,4}\s/.test(l)) return '<h4>'+l.replace(/^#{1,4}\s/,'')+'</h4>'; if(/^\s*[-•*]\s/.test(l)) return '<li>'+l.replace(/^\s*[-•*]\s/,'')+'</li>'; return l.trim()?'<p>'+l+'</p>':''; }).join('');
  return h.replace(/(?:<li>.*?<\/li>)+/g,m=>'<ul>'+m+'</ul>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

/* ---------- aviso con deshacer ---------- */
let toastTimer=null;
function pushUndo(label,fn){
  S.undo.push({label,fn}); if(S.undo.length>30) S.undo.shift(); render();
}
let undoing=false;
async function undoLast(){
  if(undoing) return;
  const u=S.undo.pop();
  if(!u){ toast('No hay nada para deshacer'); render(); return; }
  undoing=true;
  try{ await u.fn(); toast('Deshecho: '+u.label); }
  catch(e){ S.undo.push(u); }
  finally{ undoing=false; render(); }
}
function toast(msg,undo){
  const root=$('#toastroot'); clearTimeout(toastTimer);
  root.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-undo="1">Deshacer</button>':'')+'</div>';
  if(typeof undo==='function') pushUndo(msg,undo);
  toastTimer=setTimeout(()=>{ root.innerHTML=''; },undo?6000:3500);
}

  if(t.dataset.rzall){ S.rz.all=true; renderRZ(); return; }

    t.disabled=true; await bulkDelete(list,n+(n===1?' registro borrado':' registros borrados')); renderRZ(); return;
  }

  else if(a==='breast') toggleBreast(t.dataset.side);

  else if(a==='skins') openSheet({title:'Apariencia',noFocus:true,noCancel:true,fields:[{t:'skins'}],saveLabel:'Listo',onSave:async()=>true});
  else if(a==='prevday'){ S.day-=DAY; render(); }
  else if(a==='nextday'){ if(S.day<startOfDay(Date.now())){ S.day+=DAY; render(); } }
});

  }
  S.sheet={news:true};
  document.getElementById('sheetroot').innerHTML='<div class="back" id="back"><div class="sheet newsheet" role="dialog" aria-modal="true" aria-label="Novedades">'
    +'<div class="newstop"><span class="newsbadge">'+ic('heart')+'</span><div><h2>'+(fromVer!=null?'¡App actualizada!':'Novedades')+'</h2><p class="kphint">Versión '+esc(APP_VERSION)+'</p></div></div>'
    +body+'<div class="acts"><button type="button" class="primary" data-close="1">Entendido</button></div></div></div>';
}
function checkNews(){
  let seen=null; try{ seen=localStorage.getItem(VKEY); }catch(e){}
  if(seen===APP_VERSION) return;
  try{ localStorage.setItem(VKEY,APP_VERSION); }catch(e){}
  const go=()=>{ if(document.getElementById('splash')) return setTimeout(go,300); if(S.sheet) return setTimeout(go,1500); showNews(seen||''); };
  setTimeout(go,400);
}
async function checkUpdate(){
  try{
    const r=await fetch(location.href.split('#')[0],{cache:'no-store'}); if(!r.ok) return false;
    const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){
      toast('Hay una versión nueva. Actualizando…');
      try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(e){}
      try{ sessionStorage.setItem('diario-sin-inicio','1'); }catch(e){}
      setTimeout(()=>location.reload(),700); return true;
    }
  }catch(e){}
  return false;
}

/* ---------- jalar hacia abajo para actualizar ---------- */
async function refreshAll(){
  if(S.db){
    const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
    const [ev,gr,pr]=await Promise.race([Promise.all([
      S.db.collection('events').orderBy('ts','desc').limit(1000).get(),
      S.db.collection('growth').orderBy('ts','asc').limit(500).get(),
      S.db.doc('meta/profile').get()]),t]);
    S.events=ev.docs.map(snapData); S.growth=gr.docs.map(snapData); S.profile=pr.exists?pr.data():{};
    S.slow=false; S.synced=true; resolveNames();
  } else { loadLocal(); sortAll(); }
  render();
}
(function(){
  const el=document.getElementById('ptr'), TH=75, MAX=120;
  let y0=null, dy=0, busy=false;
  const set=(d,o)=>{ el.style.transform='translateY('+(d-50)+'px)'; el.style.opacity=o; el.querySelector('svg').style.transform=busy?'':'rotate('+(d*3)+'deg)'; };
  document.addEventListener('touchstart',e=>{
    if(busy||S.sheet||window.scrollY>0||e.touches.length!==1){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; el.classList.remove('anim');
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(y0==null) return;
    const d=e.touches[0].clientY-y0;
    if(d<=0||window.scrollY>0){ dy=0; set(0,0); return; }
    dy=Math.min(MAX,d*0.5); set(dy,Math.min(1,dy/TH));
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',async()=>{
    if(y0==null) return; y0=null; el.classList.add('anim');
    if(dy<TH){ set(0,0); return; }
    busy=true; el.classList.add('spin'); set(70,1);
    try{ if(await checkUpdate()) return; await refreshAll(); if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){} toast('Actualizado · tienes la última versión'); }
    catch(e){ toast('No se pudo actualizar. Revisa la conexión.'); }
    finally{ busy=false; el.classList.remove('spin'); set(0,0); }
  });
})();

checkNews();
if(typeof claude==='undefined') document.documentElement.classList.add('noclaude');
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
init();
})();
</script>
